<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Following — Football Stories</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --black: #08070A;
  --panel: #121116;
  --panel-2: #17151C;
  --line: rgba(255,255,255,0.08);
  --white: #F4F3F6;
  --muted: #9A96A3;
  --purple: #8A3FFC;
  --purple-bright: #A868FF;
  --orange: #FF7A1A;
  --orange-bright: #FF9540;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background:var(--black); color:var(--white); font-family:'Inter', sans-serif; overflow-x:hidden; }
.display{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; letter-spacing:0.01em; line-height:0.92; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
@media (max-width:640px){ .wrap{ padding:0 20px; } }

html[data-theme="light"]{
  --black:#F7F6FB; --panel:#FFFFFF; --panel-2:#F0EEF6; --line:rgba(17,17,22,0.08); --white:#121116; --muted:#5B5767;
}

/* ---------- HEADER (same as the club pages) ---------- */
.club-topbar{ padding:22px 0; border-bottom:1px solid var(--line); background:rgba(8,7,10,0.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); position:sticky; top:0; z-index:100; }
html[data-theme="light"] .club-topbar{ background:rgba(247,246,251,0.82); }
.navbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; }
.logo{ display:flex; align-items:center; gap:10px; font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:22px; letter-spacing:0.02em; justify-self:start; }
.logo-img{ width:32px; height:32px; object-fit:contain; flex-shrink:0; }
nav.links{ display:flex; gap:36px; font-size:15px; font-weight:500; color:var(--muted); justify-self:center; }
nav.links a{ transition:color .2s ease; }
nav.links a:hover{ color:var(--white); }
.nav-actions{ justify-self:end; display:flex; align-items:center; gap:12px; }
.nav-home{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); color:var(--white); font-weight:700; font-size:14px; padding:10px 16px; border-radius:6px; white-space:nowrap; transition:border-color .2s ease, background .2s ease; }
.nav-home:hover{ border-color:var(--purple-bright); background:var(--panel-2); }
.nav-home svg{ color:var(--orange-bright); flex-shrink:0; }
.nav-cta{ background:var(--white); color:var(--black); font-weight:700; font-size:14px; padding:11px 22px; border-radius:6px; white-space:nowrap; transition:background .2s ease; }
.nav-cta:hover{ background:var(--orange-bright); }
html[data-theme="light"] .nav-cta{ background:var(--purple); color:#fff; }
html[data-theme="light"] .nav-cta:hover{ background:var(--orange); }
html[data-theme="light"] .nav-home{ color:var(--muted); }
html[data-theme="light"] .nav-home:hover{ color:var(--white); }
.theme-toggle{ background:none; border:1px solid var(--line); border-radius:8px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--white); cursor:pointer; }
.theme-toggle .ti-moon{ display:block; } .theme-toggle .ti-sun{ display:none; }
html[data-theme="light"] .theme-toggle .ti-moon{ display:none; } html[data-theme="light"] .theme-toggle .ti-sun{ display:block; }
@media (max-width:860px){ nav.links{ display:none; } .navbar{ grid-template-columns:1fr auto; } }
@media (max-width:560px){ .logo{ font-size:15px; gap:8px; white-space:nowrap; } .logo-img{ width:28px; height:28px; } .navbar{ gap:12px; } .nav-actions{ gap:8px; } .nav-home span{ display:none; } .nav-home{ padding:10px 12px; } .nav-cta{ display:none; } }

/* ---------- PAGE ---------- */
main{ min-height:100vh; }

.pl-state{ padding:120px 16px; text-align:center; color:var(--muted); font-size:15px; }
.pl-state .display{ font-size:28px; color:var(--white); margin-bottom:10px; text-transform:uppercase; }

.pl-hero{ display:flex; gap:28px; align-items:flex-end; padding:36px 0 32px; border-bottom:1px solid var(--line); margin-bottom:32px; flex-wrap:wrap; }
.pl-photo-wrap{ flex:none; width:128px; height:128px; border-radius:50%; border:3px solid var(--purple); overflow:hidden; background:var(--panel-2); display:flex; align-items:center; justify-content:center; }
.pl-photo-wrap img{ width:100%; height:100%; object-fit:cover; }
.pl-photo-wrap .pl-ini{ font:800 36px 'Big Shoulders Display'; color:var(--muted); }
.pl-head-text{ flex:1; min-width:220px; }
.pl-pos-badge{ display:inline-block; font:800 12px Inter; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(135deg,#7c3aed,#6d28d9); border-radius:8px; padding:4px 12px; margin-bottom:10px; }
.pl-name{ font-size:clamp(32px,6vw,54px); text-transform:uppercase; }
.pl-sub{ color:var(--muted); font-size:15px; margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.pl-sub b{ color:var(--white); }
.pl-shirt{ flex:none; text-align:center; }
.pl-shirt svg{ display:block; width:118px; height:auto; filter:drop-shadow(0 6px 14px rgba(124,58,237,.35)); }
.pl-sub .pl-logo{ width:24px; height:24px; }

.pl-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:40px; }
@media (max-width:860px){ .pl-grid{ grid-template-columns:repeat(2,1fr); } }
.pl-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
.pl-card .lbl{ font:800 10.5px Inter; letter-spacing:.06em; text-transform:uppercase; color:var(--purple-bright); margin-bottom:8px; }
.pl-card .val{ font-size:19px; font-weight:700; color:var(--white); }
.pl-card .val{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pl-logo{ width:30px; height:30px; object-fit:contain; flex:none; }
.pl-flag{ width:30px; height:auto; border-radius:3px; box-shadow:0 0 0 1px rgba(128,128,128,.35); flex:none; }
.pl-tr .club{ display:flex; align-items:center; gap:10px; min-width:0; }
.pl-tr .club .pl-logo{ width:24px; height:24px; }
.pl-tr .club .pl-logo-gap{ width:24px; height:24px; flex:none; }
.pl-card .val.muted{ color:var(--muted); font-weight:500; font-size:14px; }
.pl-card .note{ margin-top:6px; font-size:11.5px; color:var(--muted); line-height:1.5; }

.pl-section{ margin-bottom:48px; }
.pl-section h2{ font-size:24px; text-transform:uppercase; margin-bottom:18px; }
.pl-transfers{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.pl-tr{ display:grid; grid-template-columns:110px 1fr 24px 1fr 120px; gap:12px; align-items:center; padding:16px 20px; border-top:1px solid var(--line); font-size:14px; }
.pl-tr:first-child{ border-top:none; }
.pl-tr .date{ color:var(--muted); font-size:13px; }
.pl-tr .club{ font-weight:600; }
a.pl-clublink{ color:inherit; text-decoration:none; }
a.pl-clublink:hover{ color:var(--purple-bright); text-decoration:underline; }
.pl-tr .arrow{ color:var(--muted); text-align:center; }
.pl-tr .fee{ text-align:right; color:var(--orange-bright); font-weight:700; }
@media (max-width:700px){ .pl-tr{ grid-template-columns:1fr; text-align:left; gap:4px; padding:14px 18px; } .pl-tr .fee{ text-align:left; } }

.pl-footnote{ color:var(--muted); font-size:12.5px; line-height:1.6; margin-bottom:60px; }
.pl-unavailable{ color:var(--muted); font-style:italic; }

.pl-pos-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:40px; display:flex; gap:28px; flex-wrap:wrap; align-items:center; }
.pl-pos-info{ flex:1; min-width:200px; }
.pl-pos-info h2{ font-size:22px; text-transform:uppercase; margin-bottom:14px; }
.pl-pos-legend{ display:flex; flex-direction:column; gap:10px; }
.pl-pos-legend .row{ display:flex; align-items:center; gap:10px; font-size:14px; }
.pl-pos-legend .dot{ width:14px; height:14px; border-radius:50%; flex:none; }
.pl-pos-legend .dot.primary{ background:var(--purple-bright); box-shadow:0 0 0 3px rgba(138,63,252,.25); }
.pl-pos-legend .dot.alt{ background:#8f8b99; }
.pl-pos-legend .lbl{ color:var(--white); font-weight:600; }
.pl-pos-legend .sub{ color:var(--muted); font-size:12px; }
.pl-pos-legend .unavailable{ color:var(--muted); font-size:13px; font-style:italic; }
.pl-pitch-wrap{ flex:none; width:190px; }
.pl-pitch-wrap svg{ width:100%; height:auto; display:block; }
.pos-pin rect{ stroke:rgba(255,255,255,.3); stroke-width:1; }
.pos-pin.primary rect{ fill:var(--purple-bright); }
.pos-pin.alt rect{ fill:#55525e; }
.pos-pin text{ font:800 9.5px 'Inter', sans-serif; fill:#fff; letter-spacing:.02em; }
</style>

<style>
.fl-head{ padding:36px 0 6px; }
.fl-title{ font-size:clamp(34px,6vw,56px); text-transform:uppercase; }
.fl-sub{ color:var(--muted); margin-top:6px; font-size:15px; }
.fl-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 28px; }
.fl-tab{ font:600 14px Inter,sans-serif; padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; transition:border-color .2s,color .2s; }
.fl-tab:hover{ color:var(--white); }
.fl-tab[aria-selected="true"]{ color:var(--white); border-color:var(--purple-bright); background:var(--panel-2); }
.fl-tab:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }
.fl-section{ margin-bottom:40px; }
.fl-section h2{ font-size:24px; text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.fl-count{ font:700 12px Inter,sans-serif; color:var(--muted); background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
.fl-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.fl-card{ position:relative; display:flex; align-items:center; gap:14px; padding:16px 62px 16px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--white); text-decoration:none; transition:transform .18s ease,border-color .2s; }
a.fl-card:hover{ transform:translateY(-2px); border-color:var(--purple-bright); }
.fl-media{ flex:none; width:56px; height:56px; border-radius:12px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; overflow:hidden; font:800 18px 'Big Shoulders Display',sans-serif; color:var(--muted); text-transform:uppercase; }
.fl-media img{ width:100%; height:100%; object-fit:contain; padding:6px; box-sizing:border-box; }
.fl-player .fl-media{ border-radius:50%; border:2px solid var(--purple); }
.fl-player .fl-media img{ object-fit:cover; padding:0; }
.fl-text{ min-width:0; display:flex; flex-direction:column; gap:3px; }
.fl-name{ font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fl-meta{ color:var(--muted); font-size:13px; }
.fl-card > .fs-fav{ top:50%; right:14px; margin-top:-18px; }
.fl-empty{ text-align:center; padding:64px 20px 80px; border:1px dashed var(--line); border-radius:16px; background:var(--panel); }
.fl-empty h2{ font-size:28px; text-transform:uppercase; margin-bottom:8px; }
.fl-empty p{ color:var(--muted); max-width:440px; margin:0 auto 20px; line-height:1.5; }
.fl-empty a{ display:inline-block; font-weight:700; font-size:14px; padding:11px 20px; border-radius:10px; background:var(--white); color:var(--bg,#0a090d); text-decoration:none; }
.fl-empty a:hover{ opacity:.9; }
@media (prefers-reduced-motion:reduce){ .fl-card{ transition:none; } }
</style>
</head>
<body>

<script src="site-header.js"></script>

<main>
  <div class="wrap">
    <div class="fl-head">
      <h1 class="display fl-title">Following</h1>
      <p class="fl-sub" id="flSub">Clubs and players you follow.</p>
    </div>
    <div class="fl-tabs" id="flTabs" role="tablist" aria-label="Filter followed items" hidden></div>
    <div id="flRoot"></div>
  </div>
</main>

<script src="favorites.js"></script>
<script>
(function () {
  'use strict';
  var F = window.FS96Favorites;
  var root = document.getElementById('flRoot'), tabsEl = document.getElementById('flTabs'), sub = document.getElementById('flSub');
  var filter = 'all';
  var SECTIONS = [['club', 'Clubs'], ['player', 'Players'], ['league', 'Leagues']];

  function safeSrc(u) { return /^(https?:)?\/\//i.test(u) || /^[\w\/.\-]+$/.test(u) ? u : ''; }
  function initials(n) { var w = String(n || '').trim().split(/\s+/); return ((w[0] || '')[0] || '') + ((w[1] || '')[0] || ''); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function card(f) {
    var c = el(f.url ? 'a' : 'div', 'fl-card fl-' + f.type);
    if (f.url) c.href = f.url;
    c.setAttribute('data-fav-id', f.id); c.setAttribute('data-fav-type', f.type);
    c.setAttribute('data-fav-name', f.name); c.setAttribute('data-fav-badge', f.badge || ''); c.setAttribute('data-fav-url', f.url || '');
    var media = el('span', 'fl-media'), src = f.badge ? safeSrc(f.badge) : '';
    if (src) {
      var img = el('img'); img.src = src; img.alt = ''; img.loading = 'lazy';
      img.onerror = function () { img.remove(); media.textContent = initials(f.name); };
      media.appendChild(img);
    } else media.textContent = initials(f.name);
    var text = el('span', 'fl-text');
    text.appendChild(el('span', 'fl-name', f.name));
    text.appendChild(el('span', 'fl-meta', f.type.charAt(0).toUpperCase() + f.type.slice(1)));
    c.appendChild(media); c.appendChild(text);
    return c;   // favorites.js adds the heart; clicking it unfollows and this page re-renders
  }

  function render() {
    var all = F.all().slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    root.textContent = '';
    if (!all.length) {
      tabsEl.hidden = true; sub.textContent = 'Clubs and players you follow.';
      var e = el('div', 'fl-empty');
      e.appendChild(el('h2', 'display', 'Nothing here yet'));
      e.appendChild(el('p', null, 'Tap the heart on any club or player and they will show up here.'));
      var a = el('a', null, 'Browse clubs'); a.href = 'clubs.html'; e.appendChild(a);
      root.appendChild(e); return;
    }
    var groups = {}; SECTIONS.forEach(function (s) { groups[s[0]] = all.filter(function (f) { return f.type === s[0]; }); });
    var tabs = [['all', 'All', all.length]].concat(SECTIONS.filter(function (s) { return groups[s[0]].length; }).map(function (s) { return [s[0], s[1], groups[s[0]].length]; }));
    if (!tabs.some(function (t) { return t[0] === filter; })) filter = 'all';
    tabsEl.hidden = tabs.length < 3;          // no point in tabs when only one kind is followed
    tabsEl.textContent = '';
    tabs.forEach(function (t) {
      var b = el('button', 'fl-tab', t[1] + ' · ' + t[2]); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', t[0] === filter ? 'true' : 'false');
      b.addEventListener('click', function () { filter = t[0]; render(); });
      tabsEl.appendChild(b);
    });
    var c = groups.club.length, p = groups.player.length;
    sub.textContent = 'You follow ' + (c ? c + (c === 1 ? ' club' : ' clubs') : '') + (c && p ? ' and ' : '') + (p ? p + (p === 1 ? ' player' : ' players') : '') + (!c && !p ? all.length + ' items' : '') + '.';
    SECTIONS.forEach(function (s) {
      var list = groups[s[0]];
      if (!list.length || (filter !== 'all' && filter !== s[0])) return;
      var sec = el('section', 'fl-section'), h = el('h2', 'display', s[1]);
      h.appendChild(el('span', 'fl-count', String(list.length)));
      var grid = el('div', 'fl-grid');
      list.forEach(function (f) { grid.appendChild(card(f)); });
      sec.appendChild(h); sec.appendChild(grid); root.appendChild(sec);
    });
  }
  document.addEventListener('fs96:favorites-changed', render);
  render();
})();
</script>

<script src="player-search.js"></script>
</body>
