<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

<script>
function qsParam(name){ return new URLSearchParams(location.search).get(name); }
const MATCH_ID = qsParam('id');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

async function fetchMatch(type){
  const res = await fetch('/api/match?id=' + encodeURIComponent(MATCH_ID) + '&type=' + type);
  return res.json();
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = function(n){ return String(n).padStart(2,'0'); };
  return days[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() +
    ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function statusText(s){
  if (!s) return '';
  if (['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1){
    return (s.elapsed ? s.elapsed + "'" : 'LIVE');
  }
  if (s.short === 'HT') return 'Half-time';
  if (['FT','AET','PEN'].indexOf(s.short) !== -1) return 'Full-time';
  if (s.short === 'NS') return 'Not started';
  if (['PST','CANC','ABD'].indexOf(s.short) !== -1) return s.long || s.short;
  return s.long || s.short;
}

function isLiveStatus(s){
  return s && ['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1;
}

// Renders the shared match header + nav tabs at the top of every page.
// activePage is one of: summary, events, lineups, statistics, players, table
function renderMatchChrome(activePage, summary){
  const nav = [
    ['summary', 'Summary', 'match.html'],
    ['events', 'Events', 'match-events.html'],
    ['lineups', 'Lineups', 'match-lineups.html'],
    ['statistics', 'Statistics', 'match-statistics.html'],
    ['players', 'Players', 'match-players.html'],
    ['table', 'Table', 'match-table.html'],
  ];
  const navHtml = nav.map(function(n){
    return '<a href="' + n[2] + '?id=' + encodeURIComponent(MATCH_ID) + '"' +
      (n[0] === activePage ? ' class="active"' : '') + '>' + n[1] + '</a>';
  }).join('');

  let headHtml = '';
  if (summary){
    const live = isLiveStatus(summary.status);
    const homeScore = (summary.goals.home === null || summary.goals.home === undefined) ? '-' : summary.goals.home;
    const awayScore = (summary.goals.away === null || summary.goals.away === undefined) ? '-' : summary.goals.away;
    let subLine = '';
    if (summary.halftime) subLine += 'HT ' + summary.halftime.home + '-' + summary.halftime.away + '  ';
    if (summary.extratime) subLine += 'AET ' + summary.extratime.home + '-' + summary.extratime.away + '  ';
    if (summary.penalty) subLine += 'Pens ' + summary.penalty.home + '-' + summary.penalty.away;

    const metaParts = [];
    metaParts.push('<span>' + escapeHtml(fmtDateTime(summary.date)) + '</span>');
    if (summary.venue) metaParts.push('<span>' + escapeHtml(summary.venue.name) + (summary.venue.city ? ', ' + escapeHtml(summary.venue.city) : '') + '</span>');
    if (summary.referee) metaParts.push('<span>Referee: <strong>' + escapeHtml(summary.referee) + '</strong></span>');
    if (summary.league.round) metaParts.push('<span>' + escapeHtml(summary.league.round) + '</span>');

    headHtml =
      '<div class="match-head-top">' + (summary.league.logo ? '<img src="' + summary.league.logo + '" alt="" />' : '') +
        escapeHtml(summary.league.name) + '</div>' +
      '<div class="match-head-teams">' +
        '<div class="match-head-team">' + (summary.home.logo ? '<img src="' + summary.home.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.home.name) + '</div></div>' +
        '<div class="match-head-score">' +
          '<div class="score">' + homeScore + ' &ndash; ' + awayScore + '</div>' +
          '<div class="status' + (live ? ' live' : '') + '">' + (live ? '<span class="dot"></span>' : '') + escapeHtml(statusText(summary.status)) + '</div>' +
        '</div>' +
        '<div class="match-head-team">' + (summary.away.logo ? '<img src="' + summary.away.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.away.name) + '</div></div>' +
      '</div>' +
      (subLine ? '<div class="match-head-sub">' + escapeHtml(subLine.trim()) + '</div>' : '') +
      (metaParts.length ? '<div class="match-head-meta">' + metaParts.join('') + '</div>' : '');
  }

  document.getElementById('matchHeadCard').innerHTML = headHtml || '<div class="state-msg">Match not found.</div>';
  document.getElementById('matchNav').innerHTML = navHtml;
}

function showState(container, msg, isError){
  container.innerHTML = '<div class="state-msg' + (isError ? ' error' : '') + '">' + escapeHtml(msg) + '</div>';
}

</script>
<script>
// ---- league table with both clubs of this match highlighted -------------------
// Uses the site's existing /api/standings endpoint (football-data.org). It does NOT
// use API-Football, so opening this tab costs no API-Football request beyond the
// (already cached) match summary.
const TABLE_LEAGUES = { 39: 1, 135: 1, 78: 1, 140: 1, 61: 1, 2: 1, 71: 1, 94: 1 }; // leagues /api/standings serves

// Team names differ between the two providers ("Manchester United" vs "Man United",
// "Atletico Madrid" vs "Atleti"), so they are compared by normalised words.
const TEAM_STOP = new Set(['fc','cf','afc','ac','as','ss','ssc','sc','sk','fk','cd','rc','rcd','ca','ec','us','club','clube','de','da','do','calcio','sad','futebol','the']);
const TEAM_TOKEN_ALIAS = { man: 'manchester', utd: 'united', atleti: 'atletico', barca: 'barcelona', spurs: 'tottenham', wolves: 'wolverhampton' };
// Names that need an explicit group (a shorter name would otherwise also match another club).
const TEAM_GROUPS = [
  ['inter', 'inter milan', 'internazionale', 'internazionale milano'],
  ['milan', 'ac milan'],
  ['paris saint germain', 'paris sg', 'psg'],
  ['bayern', 'bayern munich', 'bayern munchen'],
  ['borussia monchengladbach', 'monchengladbach', 'm gladbach', 'gladbach', 'borussia m gladbach'],
  ['barcelona', 'fc barcelona'],
  ['espanyol', 'espanyol barcelona'],
  ['atletico madrid', 'atletico', 'club atletico madrid'],
  ['atletico mineiro', 'atletico mg'],
  ['athletico paranaense', 'athletico pr'],
  ['atletico goianiense', 'atletico go'],
  ['rb bragantino', 'red bull bragantino', 'bragantino'],
  ['brest', 'stade brestois', 'stade brestois 29'],
  ['rennes', 'stade rennais'],
  ['lyon', 'olympique lyonnais', 'olympique lyon'],
  ['slavia prague', 'slavia praha'],
  ['sparta prague', 'sparta praha'],
  ['red star belgrade', 'crvena zvezda'],
  ['rb salzburg', 'red bull salzburg', 'salzburg'],
];

function teamTokens(name){
  return String(name || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ')
    .split(' ')
    .filter(function(w){ return w && !TEAM_STOP.has(w) && !/^[0-9]+$/.test(w); })
    .map(function(w){ return TEAM_TOKEN_ALIAS[w] || w; });
}
const TEAM_GROUP_OF = {};
TEAM_GROUPS.forEach(function(g, i){ g.forEach(function(n){ TEAM_GROUP_OF[teamTokens(n).join(' ')] = i; }); });

function sameTeam(a, b){
  const ta = teamTokens(a), tb = teamTokens(b);
  if (!ta.length || !tb.length) return false;
  const ka = ta.join(' '), kb = tb.join(' ');
  if (ka === kb) return true;
  const ga = TEAM_GROUP_OF[ka], gb = TEAM_GROUP_OF[kb];
  if (ga !== undefined || gb !== undefined) return ga === gb; // one side is a known club: only its own group matches
  const small = ta.length <= tb.length ? ta : tb;
  const big = ta.length <= tb.length ? tb : ta;
  return small.every(function(w){ return big.indexOf(w) !== -1; }); // "Leeds" is inside "Leeds United"
}

function zoneClass(description){
  if (!description) return '';
  const d = String(description).toLowerCase();
  if (d.indexOf('champions league') !== -1 || d.indexOf('qualification') !== -1) return 'zone-continental';
  if (d.indexOf('europa') !== -1 || d.indexOf('conference') !== -1) return 'zone-europa';
  if (d.indexOf('relegation') !== -1) return 'zone-relegation';
  return '';
}

(async function(){
  const body = document.getElementById('tableBody');
  if (!MATCH_ID){
    document.getElementById('matchHeadCard').innerHTML = '<div class="state-msg error">No match selected.</div>';
    document.getElementById('matchNav').innerHTML = '';
    return;
  }
  showState(body, 'Loading table…', false);
  try {
    const summaryRes = await fetchMatch('summary');
    renderMatchChrome('table', summaryRes.ok ? summaryRes.data : null);
    if (!summaryRes.ok){
      showState(body, 'Unable to load this match.', true);
      return;
    }
    const s = summaryRes.data;
    if (!TABLE_LEAGUES[s.league.id]){
      showState(body, 'A league table is not available for this competition.', false);
      return;
    }
    const res = await fetch('/api/standings?league=' + encodeURIComponent(s.league.id));
    const json = await res.json();
    if (!json.ok || !json.data || !json.data.standings || !json.data.standings.length){
      showState(body, 'Table unavailable right now.', true);
      return;
    }
    const d = json.data;
    let found = 0;
    const rows = d.standings.map(function(r){
      const hl = sameTeam(r.team.name, s.home.name) || sameTeam(r.team.name, s.away.name);
      if (hl) found++;
      const gd = (r.goalsDiff > 0 ? '+' + r.goalsDiff : (r.goalsDiff == null ? '-' : r.goalsDiff));
      return '<tr class="' + zoneClass(r.description) + (hl ? ' hl' : '') + '">' +
        '<td class="rank">' + r.rank + '</td>' +
        '<td class="club">' + (r.team.logo ? '<img src="' + r.team.logo + '" alt="" />' : '') +
          '<span class="n">' + escapeHtml(r.team.name) + '</span></td>' +
        '<td class="num">' + (r.played != null ? r.played : '-') + '</td>' +
        '<td class="num">' + gd + '</td>' +
        '<td class="num pts">' + (r.points != null ? r.points : '-') + '</td>' +
      '</tr>';
    }).join('');

    body.innerHTML =
      '<div class="table-card">' +
        '<div class="table-card-head">' + (d.league && d.league.logo ? '<img src="' + d.league.logo + '" alt="" />' : '') +
          '<span>' + escapeHtml(s.league.name) + '</span></div>' +
        '<table class="standings-table"><thead><tr>' +
          '<th></th><th>Club</th><th class="num">P</th><th class="num">GD</th><th class="num">PTS</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  } catch(e){
    renderMatchChrome('table', null);
    showState(body, 'Table unavailable right now.', true);
  }
})();
</script>
