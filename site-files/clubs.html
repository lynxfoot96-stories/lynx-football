<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

/* =====================================================================
   FOOTBALL STORIES 96 — LIGHT MODE
   Scoped entirely under html[data-theme="light"] so the dark theme
   (driven by the original :root variables above) stays the default
   and completely untouched.
   ===================================================================== */

html[data-theme="light"]{
  --black:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F6F6F8;
  --line:#E5E5EA;
  --white:#111116;
  --muted:#55555F;
  --purple:#7B2CFF;
  --purple-bright:#6420D6;
  --orange:#FF6A00;
  --orange-bright:#E85A00;
}

/* ---- theme toggle button (same markup/classes on every page) ---- */
.theme-toggle{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--white);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:border-color .2s ease, color .2s ease, background .2s ease, transform .15s ease;
}
.theme-toggle:hover{ border-color:var(--purple-bright); color:var(--purple-bright); transform:translateY(-1px); }
.theme-toggle .ti-moon{ display:block; }
.theme-toggle .ti-sun{ display:none; }
html[data-theme="light"] .theme-toggle .ti-moon{ display:none; }
html[data-theme="light"] .theme-toggle .ti-sun{ display:block; }

/* ---- glass header / topbars: light instead of black ---- */
html[data-theme="light"] header,
html[data-theme="light"] .club-topbar,
html[data-theme="light"] .match-topbar{
  background:rgba(255,255,255,0.86);
}

/* ---- nav CTA + home link ---- */
html[data-theme="light"] .nav-cta{ background:var(--purple); color:#fff; }
html[data-theme="light"] .nav-cta:hover{ background:var(--orange); }
html[data-theme="light"] .nav-home{ color:var(--muted); }
html[data-theme="light"] .nav-home:hover{ color:var(--white); }

/* ---- hero ---- */
html[data-theme="light"] .hero-bg{
  background:
    radial-gradient(ellipse 60% 50% at 18% 25%, rgba(123,44,255,0.14), transparent 60%),
    radial-gradient(ellipse 55% 45% at 88% 70%, rgba(255,106,0,0.13), transparent 60%),
    linear-gradient(180deg, #FFFFFF 0%, #F6F6F8 100%);
}
html[data-theme="light"] .grain{ opacity:0.025; }
html[data-theme="light"] .hero h1{
  background:linear-gradient(100deg, #111116 40%, var(--purple-bright) 75%, var(--orange-bright) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
html[data-theme="light"] .btn-ghost{ border-color:rgba(17,17,22,0.16); }
html[data-theme="light"] .btn-ghost:hover{ background:rgba(255,106,0,0.06); }
html[data-theme="light"] .channel-badge img{ border-color:rgba(17,17,22,0.12); }

/* ---- section heads ---- */
html[data-theme="light"] .section-head h2{ color:var(--white); }

/* ---- soft card shadows (per brief: very soft, no heavy shadow) ---- */
html[data-theme="light"] .featured,
html[data-theme="light"] .video-card,
html[data-theme="light"] .news-card,
html[data-theme="light"] .contact-card,
html[data-theme="light"] .cat-tile,
html[data-theme="light"] .privacy-toggle,
html[data-theme="light"] .club-spotlight,
html[data-theme="light"] .club-news-card,
html[data-theme="light"] .club-video-card,
html[data-theme="light"] .club-placeholder,
html[data-theme="light"] .summary-card,
html[data-theme="light"] .side-card,
html[data-theme="light"] .nx-featured,
html[data-theme="light"] .nx-card,
html[data-theme="light"] .vcard,
html[data-theme="light"] .match-head-card,
html[data-theme="light"] .summary-extra,
html[data-theme="light"] .summary-cta,
html[data-theme="light"] .league-group,
html[data-theme="light"] .standings-panel,
html[data-theme="light"] .standings-full-wrap{
  box-shadow:0 1px 2px rgba(17,17,22,0.03), 0 10px 26px rgba(17,17,22,0.05);
}

html[data-theme="light"] .cat-tile.active{
  background:linear-gradient(160deg, rgba(123,44,255,0.08), rgba(255,106,0,0.06));
  box-shadow:0 0 0 1px rgba(123,44,255,0.18) inset;
}

/* ---- about section chip ---- */
html[data-theme="light"] .topic-chip{ border-color:rgba(17,17,22,0.14); }

/* ---- CTA banner: soft light gradient, same glow accents, gentler ---- */
html[data-theme="light"] .cta-banner{ background:var(--panel-2); }
html[data-theme="light"] .cta-banner::before{ background:radial-gradient(circle, rgba(123,44,255,0.14), transparent 60%); }

const KC=(()=>{try{return JSON.parse(localStorage.getItem("fs-club-cols-v1")||"{}")}catch(e){return{}}})();

function pickColors(img){
 const S=40,cv=document.createElement("canvas");cv.width=cv.height=S;const x=cv.getContext("2d",{willReadFrequently:true});
 x.drawImage(img,0,0,S,S);const d=x.getImageData(0,0,S,S).data,B={};
 for(let i=0;i<d.length;i+=4){const a=d[i+3];if(a<200)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  if(mn>215)continue;                       /* skip white */
  const sat=mx?(mx-mn)/mx:0,k=(r>>5)+","+(g>>5)+","+(b>>5);
  const w=1+(sat>.35?2.5:0);                /* favour real colours over greys */
  (B[k]=B[k]||{r:0,g:0,b:0,n:0,w:0}); const o=B[k];o.r+=r;o.g+=g;o.b+=b;o.n++;o.w+=w}
 const L=Object.values(B).map(o=>({r:o.r/o.n|0,g:o.g/o.n|0,b:o.b/o.n|0,w:o.w})).sort((p,q)=>q.w-p.w);
 if(!L.length)return null;
 const dist=(p,q)=>Math.hypot(p.r-q.r,p.g-q.g,p.b-q.b);
 const c1=L[0],c2=L.find(c=>dist(c,c1)>90)||c1;
 const hex=c=>"#"+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("");
 /* keep very dark colours visible against the dark card */
 const lift=c=>{const m=Math.max(c.r,c.g,c.b);return m<40?{r:c.r+26,g:c.g+26,b:c.b+30}:c};
 return [hex(lift(c1)),hex(lift(c2))]}

function colourCards(){

  im.src=el.dataset.src})}
