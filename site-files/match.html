<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

<script>
function qsParam(name){ return new URLSearchParams(location.search).get(name); }
const MATCH_ID = qsParam('id');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* match header: team logo + name (a link to the club page when we can resolve it) */
function teamBlock(t){
  var inner = (t.logo ? '<img src="' + t.logo + '" alt="" />' : '') + '<div class="name display">' + escapeHtml(t.name) + '</div>';
  var h = clubHref(t);
  return h ? '<a class="match-head-team club-link" href="' + h + '" title="' + escapeHtml(t.name) + ' club page">' + inner + '</a>'
           : '<div class="match-head-team">' + inner + '</div>';
}
/* ---- club links: logo / name -> club page (own page if we have one, else club.html?id=) ---- */
function clubHref(team){
  if (!team) return null;
  var M = window.FSClubMeta;
  if (M && M.CLUBS){
    for (var s in M.CLUBS){ if (M.isClubTeam(M.CLUBS[s], team)) return s + '.html'; }
  }
  return team.id ? 'club.html?id=' + encodeURIComponent(team.id) : null;
}

async function fetchMatch(type){
  const res = await fetch('/api/match?id=' + encodeURIComponent(MATCH_ID) + '&type=' + type);
  return res.json();
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = function(n){ return String(n).padStart(2,'0'); };
  return days[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() +
    ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function statusText(s){
  if (!s) return '';
  if (['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1){
    return (s.elapsed ? s.elapsed + "'" : 'LIVE');
  }
  if (s.short === 'HT') return 'Half-time';
  if (['FT','AET','PEN'].indexOf(s.short) !== -1) return 'Full-time';
  if (s.short === 'NS') return 'Not started';
  if (['PST','CANC','ABD'].indexOf(s.short) !== -1) return s.long || s.short;
  return s.long || s.short;
}

function isLiveStatus(s){
  return s && ['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1;
}

// Renders the shared match header + nav tabs at the top of every page.
// activePage is one of: summary, events, lineups, statistics, players, table
// keyEvents (optional) is the raw /api/match?type=events list, used only
// to show goal scorers and red cards right under the score -- the full
// Events page/timeline is a separate, not-yet-built page.
function renderMatchChrome(activePage, summary, keyEvents){
  const nav = [
    ['summary', 'Summary', 'match.html'],
    ['events', 'Events', 'match-events.html'],
    ['lineups', 'Lineups', 'match-lineups.html'],
    ['statistics', 'Statistics', 'match-statistics.html'],
    ['players', 'Players', 'match-players.html'],
    ['table', 'Table', 'match-table.html'],
  ];
  const navHtml = nav.map(function(n){
    return '<a href="' + n[2] + '?id=' + encodeURIComponent(MATCH_ID) + '"' +
      (n[0] === activePage ? ' class="active"' : '') + '>' + n[1] + '</a>';
  }).join('');

  let headHtml = '';
  if (summary){
    const live = isLiveStatus(summary.status);
    const homeScore = (summary.goals.home === null || summary.goals.home === undefined) ? '-' : summary.goals.home;
    const awayScore = (summary.goals.away === null || summary.goals.away === undefined) ? '-' : summary.goals.away;
    let subLine = '';
    if (summary.halftime) subLine += 'HT ' + summary.halftime.home + '-' + summary.halftime.away + '  ';
    if (summary.extratime) subLine += 'AET ' + summary.extratime.home + '-' + summary.extratime.away + '  ';
    if (summary.penalty) subLine += 'Pens ' + summary.penalty.home + '-' + summary.penalty.away;

    const metaParts = [];
    metaParts.push('<span>' + escapeHtml(fmtDateTime(summary.date)) + '</span>');
    if (summary.venue) metaParts.push('<span>' + escapeHtml(summary.venue.name) + (summary.venue.city ? ', ' + escapeHtml(summary.venue.city) : '') + '</span>');
    if (summary.referee) metaParts.push('<span>Referee: <strong>' + escapeHtml(summary.referee) + '</strong></span>');
    if (summary.league.round) metaParts.push('<span>' + escapeHtml(summary.league.round) + '</span>');

    // Goals + red cards only, sorted by minute, one row per event: the
    // scoring/carded side's name sits on its own side of a centred icon
    // column, exactly like a classic scoreboard goal list.
    let eventsHtml = '';
    if (keyEvents && keyEvents.length){
      const rows = keyEvents
        .filter(function(e){
          return e.type === 'goal' || (e.type === 'card' && /red|second yellow/i.test(e.detail || ''));
        })
        .map(function(e){
          const isHome = summary.home.id && e.team.id === summary.home.id;
          const isAway = summary.away.id && e.team.id === summary.away.id;
          let name = e.player ? e.player.name : '';
          if (e.type === 'goal' && /own goal/i.test(e.detail || '')) name += ' (OG)';
          else if (e.type === 'goal' && /penalty/i.test(e.detail || '')) name += ' (pen)';
          const centerHtml = e.type === 'goal' ? '<span class="ev-icon">&#9917;</span>' : '<span class="ev-icon card-red"></span>';
          const side = '<span class="ev-name">' + escapeHtml(name) + '</span><span class="ev-min">' + escapeHtml(e.minute) + "'</span>";
          return '<div class="ev-row">' +
            '<span class="ev-side home">' + (isHome ? side : '') + '</span>' +
            centerHtml +
            '<span class="ev-side away">' + (isAway ? side : '') + '</span>' +
          '</div>';
        }).join('');
      if (rows) eventsHtml = '<div class="match-head-events">' + rows + '</div>';
    }

    headHtml =
      '<div class="match-head-top">' + (summary.league.logo ? '<img src="' + summary.league.logo + '" alt="" />' : '') +
        escapeHtml(summary.league.name) + '</div>' +
      '<div class="match-head-teams">' +
        teamBlock(summary.home) +
        '<div class="match-head-score">' +
          '<div class="score">' + homeScore + ' &ndash; ' + awayScore + '</div>' +
          '<div class="status' + (live ? ' live' : '') + '">' + (live ? '<span class="dot"></span>' : '') + escapeHtml(statusText(summary.status)) + '</div>' +
        '</div>' +
        teamBlock(summary.away) +
      '</div>' +
      (subLine ? '<div class="match-head-sub">' + escapeHtml(subLine.trim()) + '</div>' : '') +
      eventsHtml +
      (metaParts.length ? '<div class="match-head-meta">' + metaParts.join('') + '</div>' : '');
  }

  document.getElementById('matchHeadCard').innerHTML = headHtml || '<div class="state-msg error">Unable to load this match.</div>';
  document.getElementById('matchNav').innerHTML = navHtml;
}

function showState(container, msg, isError){
  container.innerHTML = '<div class="state-msg' + (isError ? ' error' : '') + '">' + escapeHtml(msg) + '</div>';
}

</script>
<script>
(async function(){
  const extra = document.getElementById('summaryExtra');

  // Missing or malformed id: never attempt a fetch, never show a broken
  // nav/header -- just a clear, actionable message with a way back.
  if (!MATCH_ID || !/^[0-9]+$/.test(MATCH_ID)){
    document.getElementById('matchHeadCard').innerHTML =
      '<div class="state-msg error">Unable to load this match.<br>No match was selected. <a href="index.html#scores">Go back to Scores</a>.</div>';
    document.getElementById('matchNav').innerHTML = '';
    return;
  }
  try {
    const json = await fetchMatch('summary');
    if (!json.ok){
      // Covers: fixture not found, invalid id rejected by the API, or an
      // API-Football/network failure on the backend -- all surfaced the
      // same clear way rather than leaking a raw backend error string.
      renderMatchChrome('summary', null);
      showState(extra, 'Unable to load this match.', true);
      return;
    }
    const s = json.data;

    // Goal scorers / red cards are a nice-to-have under the score, not
    // essential -- if this call fails, still show the rest of the page
    // rather than treating it as a page-level error.
    let keyEvents = [];
    try {
      const eventsJson = await fetchMatch('events');
      if (eventsJson.ok) keyEvents = eventsJson.data || [];
    } catch (e) { /* silently skip the scorers/cards line */ }

    renderMatchChrome('summary', s, keyEvents);

    let html = '';

    const rows = [];
    rows.push(['Competition', escapeHtml(s.league.name)]);
    if (s.league.round) rows.push(['Round', escapeHtml(s.league.round)]);
    rows.push(['Date & time', escapeHtml(fmtDateTime(s.date))]);
    rows.push(['Status', escapeHtml(statusText(s.status))]);
    if (s.venue) rows.push(['Stadium', escapeHtml(s.venue.name) + (s.venue.city ? ', ' + escapeHtml(s.venue.city) : '')]);
    if (s.referee) rows.push(['Referee', escapeHtml(s.referee)]);
    if (s.halftime) rows.push(['Half-time score', s.halftime.home + ' - ' + s.halftime.away]);
    if (s.extratime) rows.push(['Extra-time score', s.extratime.home + ' - ' + s.extratime.away]);
    if (s.penalty) rows.push(['Penalty shootout', s.penalty.home + ' - ' + s.penalty.away]);

    html += '<div class="summary-extra"><h3>Match Facts</h3>' +
      rows.map(function(r){ return '<div class="summary-extra-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'; }).join('') +
      '</div>';

    extra.innerHTML = html;
  } catch(e){
    // Network failure / fetch never completed.
    renderMatchChrome('summary', null);
    showState(extra, 'Unable to load this match.', true);
  }
})();

</script>
