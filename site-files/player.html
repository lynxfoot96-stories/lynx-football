<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

<style>

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background:var(--black); color:var(--white); font-family:'Inter', sans-serif; overflow-x:hidden; }

html[data-theme="light"]{

.nav-home{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); color:var(--white); font-weight:700; font-size:14px; padding:10px 16px; border-radius:6px; white-space:nowrap; transition:border-color .2s ease, background .2s ease; }

/* ---------- PAGE ---------- */
main{ min-height:100vh; }

.pl-state{ padding:120px 16px; text-align:center; color:var(--muted); font-size:15px; }
.pl-state .display{ font-size:28px; color:var(--white); margin-bottom:10px; text-transform:uppercase; }

.pl-hero{ display:flex; gap:28px; align-items:flex-end; padding:36px 0 32px; border-bottom:1px solid var(--line); margin-bottom:32px; flex-wrap:wrap; }
.pl-photo-wrap{ flex:none; width:128px; height:128px; border-radius:50%; border:3px solid var(--purple); overflow:hidden; background:var(--panel-2); display:flex; align-items:center; justify-content:center; }

.pl-pos-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:40px; display:flex; gap:28px; flex-wrap:wrap; align-items:center; }
.pl-pos-info{ flex:1; min-width:200px; }
.pl-pos-info h2{ font-size:22px; text-transform:uppercase; margin-bottom:14px; }
.pl-pos-legend{ display:flex; flex-direction:column; gap:10px; }
.pl-pos-legend .row{ display:flex; align-items:center; gap:10px; font-size:14px; }
.pl-pos-legend .dot{ width:14px; height:14px; border-radius:50%; flex:none; }
.pl-pos-legend .dot.primary{ background:var(--purple-bright); box-shadow:0 0 0 3px rgba(138,63,252,.25); }
.pl-pos-legend .dot.alt{ background:#8f8b99; }

.pl-pitch-wrap{ flex:none; width:190px; }
.pl-pitch-wrap svg{ width:100%; height:auto; display:block; }
.pos-pin rect{ stroke:rgba(255,255,255,.3); stroke-width:1; }
.pos-pin.primary rect{ fill:var(--purple-bright); }
.pos-pin.alt rect{ fill:#55525e; }
.pos-pin text{ font:800 9.5px 'Inter', sans-serif; fill:#fff; letter-spacing:.02em; }
</style>

<script>
(function(){
  'use strict';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initialsOf(name){
    var w = String(name||'').trim().split(/\s+/);
    return (w.length>1 ? w[0][0]+w[w.length-1][0] : (w[0]||'?').slice(0,2)).toUpperCase();
  }
  function fmtDate(iso){
    if(!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  // ---- pitch position diagram -------------------------------------------
  // percent of pitch width/height; top = attacking end (matches primary badge like "Centre-Forward")
  var POS_COORDS = {
    ST:[50,8], SS:[50,20], LW:[14,20], RW:[86,20],
    AM:[50,34], LM:[14,48], CM:[50,48], RM:[86,48],
    DM:[50,62], LWB:[12,58], RWB:[88,58],
    LB:[14,74], CB:[38,78], RB:[86,74], GK:[50,92]
  };
  var POS_LABELS = {
    GK:'Goalkeeper', CB:'Centre-Back', LB:'Left-Back', RB:'Right-Back',
    LWB:'Left Wing-Back', RWB:'Right Wing-Back', DM:'Defensive Midfield',
    CM:'Central Midfield', AM:'Attacking Midfield', LM:'Left Midfield',
    RM:'Right Midfield', LW:'Left Winger', RW:'Right Winger',
    SS:'Second Striker', ST:'Striker'
  };
  // Best-effort match of TheSportsDB's free-text position (e.g. "Centre-Forward")
  // onto one of the codes above. Order matters: more specific patterns first.
  function normalizePosCode(text){
    var t = String(text||'').toLowerCase();
    if (!t) return null;
    if (/goalkeeper|\bkeeper\b|\bgk\b/.test(t)) return 'GK';
    if (/left.?wing.?back|\blwb\b/.test(t)) return 'LWB';
    if (/right.?wing.?back|\brwb\b/.test(t)) return 'RWB';
    if (/left.?back|\blb\b/.test(t)) return 'LB';
    if (/right.?back|\brb\b/.test(t)) return 'RB';
    if (/centre.?back|center.?back|central defender|\bcb\b/.test(t)) return 'CB';
    if (/defensive midfield|\bdm\b/.test(t)) return 'DM';
    if (/attacking midfield|\bam\b/.test(t)) return 'AM';
    if (/left midfield|\blm\b/.test(t)) return 'LM';
    if (/right midfield|\brm\b/.test(t)) return 'RM';
    if (/central midfield|centre midfield|center midfield|\bcm\b|midfielder|midfield/.test(t)) return 'CM';
    if (/left wing|\blw\b/.test(t)) return 'LW';
    if (/right wing|\brw\b/.test(t)) return 'RW';
    if (/second striker|\bss\b/.test(t)) return 'SS';
    if (/centre.?forward|center.?forward|striker|\bst\b|forward/.test(t)) return 'ST';
    if (/defender/.test(t)) return 'CB';
    if (/attacker/.test(t)) return 'ST';
    return null;
  }
  function normName(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim(); }
  var _squadIndex = null;
  function squadIndex(){
    if (_squadIndex) return _squadIndex;
    _squadIndex = {};
    var data = window.FS_PLAYERS || {};
    Object.keys(data).forEach(function(slug){
      (data[slug] || []).forEach(function(row){
        if (row[0]) _squadIndex[normName(row[0])] = { primary: row[1] || '', alt: row[2] || '' };
      });
    });
    return _squadIndex;
  }
  function squadMatch(name){ return squadIndex()[normName(name)] || null; }
  function parseCodes(str){
    return String(str || '').split(',').map(function(s){ return s.trim().toUpperCase(); }).filter(function(c){ return POS_COORDS[c]; });
  }
  function pitchSvg(markersHtml){
    return '<svg viewBox="0 0 200 300" role="img" aria-label="Pitch position diagram">' +
      '<rect x="2" y="2" width="196" height="296" rx="6" fill="#123a1f" stroke="rgba(255,255,255,.25)" stroke-width="2"/>' +
      '<line x1="2" y1="150" x2="198" y2="150" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<circle cx="100" cy="150" r="28" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<rect x="40" y="2" width="120" height="46" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<rect x="68" y="2" width="64" height="18" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<rect x="40" y="252" width="120" height="46" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<rect x="68" y="280" width="64" height="18" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      markersHtml + '</svg>';
  }
  // A rounded pill with the position code written inside it (e.g. "LW"), placed at that code's pitch coordinate.
  function posPin(code, cls){
    var xy = POS_COORDS[code]; if (!xy) return '';
    var cx = xy[0]*2, cy = xy[1]*3;
    var w = code.length >= 3 ? 38 : 32, h = 18;
    return '<g class="pos-pin ' + cls + '">' +
      '<rect x="' + (cx - w/2) + '" y="' + (cy - h/2) + '" width="' + w + '" height="' + h + '" rx="9"><title>' + esc(POS_LABELS[code]) + '</title></rect>' +
      '<text x="' + cx + '" y="' + (cy + 3.5) + '" text-anchor="middle">' + esc(code) + '</text>' +
    '</g>';
  }
  function positionSectionHtml(p){
    var primaryCode = normalizePosCode(p.position);
    var altCodes = [];
    var match = squadMatch(p.name);
    if (match) {
      if (!primaryCode) { var mp = parseCodes(match.primary)[0]; if (mp) primaryCode = mp; }
      altCodes = parseCodes(match.alt).filter(function(c){ return c !== primaryCode; });
    }
    if (!primaryCode && !altCodes.length) return '';

    var pins = '';
    altCodes.forEach(function(c){ pins += posPin(c, 'alt'); });
    if (primaryCode && POS_COORDS[primaryCode]) pins += posPin(primaryCode, 'primary');

    var legend = '<div class="pl-pos-legend">';
    if (primaryCode) {
      legend += '<div class="row"><span class="dot primary"></span><span><span class="lbl">' +
        esc(p.position || POS_LABELS[primaryCode]) + '</span><br><span class="sub">Primary position</span></span></div>';
    }
    if (altCodes.length) {
      legend += '<div class="row"><span class="dot alt"></span><span><span class="lbl">' +
        esc(altCodes.map(function(c){ return POS_LABELS[c]; }).join(', ')) + '</span><br><span class="sub">Other positions</span></span></div>';
    } else {
      legend += '<div class="row"><span class="dot alt" style="opacity:.3"></span><span class="unavailable">No alternative positions on record</span></div>';
    }
    legend += '</div>';

    return '<div class="pl-pos-card"><div class="pl-pos-info"><h2 class="display">On The Pitch</h2>' + legend + '</div>' +
      '<div class="pl-pitch-wrap">' + pitchSvg(pins) + '</div></div>';
  }

  // ---- club logos + country flags ----
  var COUNTRY = {"afghanistan":"af","albania":"al","algeria":"dz","andorra":"ad","angola":"ao","antigua and barbuda":"ag","argentina":"ar","armenia":"am","australia":"au","austria":"at","azerbaijan":"az","bahamas":"bs","bahrain":"bh","bangladesh":"bd","barbados":"bb","belarus":"by","belgium":"be","belize":"bz","benin":"bj","bermuda":"bm","bolivia":"bo","bosnia and herzegovina":"ba","bosnia-herzegovina":"ba","bosnia":"ba","botswana":"bw","brazil":"br","bulgaria":"bg","burkina faso":"bf","burundi":"bi","cameroon":"cm","canada":"ca","cape verde":"cv","cabo verde":"cv","central african republic":"cf","chad":"td","chile":"cl","china":"cn","china pr":"cn","colombia":"co","comoros":"km","congo":"cg","congo dr":"cd","dr congo":"cd","democratic republic of the congo":"cd","costa rica":"cr","cote d'ivoire":"ci","ivory coast":"ci","croatia":"hr","cuba":"cu","curacao":"cw","cyprus":"cy","czech republic":"cz","czechia":"cz","denmark":"dk","dominican republic":"do","ecuador":"ec","egypt":"eg","el salvador":"sv","england":"gb-eng","equatorial guinea":"gq","eritrea":"er","estonia":"ee","eswatini":"sz","ethiopia":"et","faroe islands":"fo","fiji":"fj","finland":"fi","france":"fr","gabon":"ga","gambia":"gm","georgia":"ge","germany":"de","ghana":"gh","gibraltar":"gi","greece":"gr","grenada":"gd","guadeloupe":"gp","guatemala":"gt","guinea":"gn","guinea-bissau":"gw","guyana":"gy","haiti":"ht","honduras":"hn","hong kong":"hk","hungary":"hu","iceland":"is","india":"in","indonesia":"id","iran":"ir","iraq":"iq","ireland":"ie","republic of ireland":"ie","israel":"il","italy":"it","jamaica":"jm","japan":"jp","jordan":"jo","kazakhstan":"kz","kenya":"ke","kosovo":"xk","kuwait":"kw","kyrgyzstan":"kg","latvia":"lv","lebanon":"lb","lesotho":"ls","liberia":"lr","libya":"ly","liechtenstein":"li","lithuania":"lt","luxembourg":"lu","madagascar":"mg","malawi":"mw","malaysia":"my","mali":"ml","malta":"mt","martinique":"mq","mauritania":"mr","mauritius":"mu","mexico":"mx","moldova":"md","montenegro":"me","morocco":"ma","mozambique":"mz","namibia":"na","netherlands":"nl","holland":"nl","new caledonia":"nc","new zealand":"nz","nicaragua":"ni","niger":"ne","nigeria":"ng","north korea":"kp","korea dpr":"kp","north macedonia":"mk","macedonia":"mk","northern ireland":"gb-nir","norway":"no","oman":"om","pakistan":"pk","palestine":"ps","panama":"pa","papua new guinea":"pg","paraguay":"py","peru":"pe","philippines":"ph","poland":"pl","portugal":"pt","puerto rico":"pr","qatar":"qa","romania":"ro","russia":"ru","rwanda":"rw","saint kitts and nevis":"kn","saint lucia":"lc","san marino":"sm","saudi arabia":"sa","scotland":"gb-sct","senegal":"sn","serbia":"rs","sierra leone":"sl","singapore":"sg","slovakia":"sk","slovenia":"si","somalia":"so","south africa":"za","south korea":"kr","korea republic":"kr","korea":"kr","south sudan":"ss","spain":"es","sri lanka":"lk","sudan":"sd","suriname":"sr","sweden":"se","switzerland":"ch","syria":"sy","tajikistan":"tj","tanzania":"tz","thailand":"th","togo":"tg","trinidad and tobago":"tt","tunisia":"tn","turkey":"tr","turkiye":"tr","turkmenistan":"tm","uganda":"ug","ukraine":"ua","united arab emirates":"ae","uae":"ae","united kingdom":"gb","uk":"gb","united states":"us","usa":"us","uruguay":"uy","uzbekistan":"uz","venezuela":"ve","vietnam":"vn","wales":"gb-wls","yemen":"ye","zambia":"zm","zimbabwe":"zw"};
  function flagCode(country){
    var k = String(country||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    return COUNTRY[k] || null;
  }
  function flagHtml(country){
    var c = flagCode(country);
    if (!c) return '';
    return '<img class="pl-flag" src="https://flagcdn.com/w40/' + c + '.png" srcset="https://flagcdn.com/w80/' + c + '.png 2x" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  }
  // Badges come from TheSportsDB. Try the small version first, fall back to the original, then hide.
  function logoHtml(url, keepSpace){
    if (!url) return keepSpace ? '<span class="pl-logo-gap"></span>' : '';
    var u = esc(url);
    return '<img class="pl-logo" src="' + u + '/small" alt="" loading="lazy" ' +
      'onerror="if(!this.dataset.f){this.dataset.f=1;this.src=\'' + u + '\';}else{this.style.visibility=\'hidden\';}">';
  }

  // A shirt with the player's number on it (replaces the big "#10" text).
  function jerseySvg(num){
    var n = String(num).replace(/[^0-9A-Za-z]/g,'').slice(0,3);
    if (!n) return '';
    var fs = n.length >= 3 ? 34 : (n.length === 2 ? 46 : 54);
    return '<svg viewBox="0 0 120 120" role="img" aria-label="Shirt number ' + esc(n) + '">' +
      '<defs><linearGradient id="jerseyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9B5CFF"/><stop offset="1" stop-color="#6D28D9"/></linearGradient></defs>' +
      '<path d="M40 8 L22 16 L4 40 L20 52 L30 44 L30 112 L90 112 L90 44 L100 52 L116 40 L98 16 L80 8 Q60 26 40 8 Z" fill="url(#jerseyG)" stroke="#4C1D95" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M40 8 Q60 26 80 8" fill="none" stroke="#F4F3F6" stroke-opacity=".85" stroke-width="3.5" stroke-linecap="round"/>' +
      '<path d="M7 38 L22 48 M113 38 L98 48" stroke="#F4F3F6" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="60" y="' + (n.length >= 3 ? 82 : 87) + '" text-anchor="middle" font-family="\'Big Shoulders Display\', Impact, sans-serif" font-weight="900" font-size="' + fs + '" fill="#FFFFFF">' + esc(n) + '</text>' +
      '</svg>';
  }

  var root = document.getElementById('playerRoot');
  var params = new URLSearchParams(location.search);
  var name = (params.get('name') || '').trim();
  var club = (params.get('club') || '').trim();

  if (!name) {
    root.innerHTML = '<div class="pl-state"><div class="display">No player selected</div><p>Go back and pick a player from a club squad or the search bar.</p></div>';
    return;
  }
  document.title = name + ' — Football Stories';

  function fieldVal(val, unavailableFields, key, formatted) {
    var missing = unavailableFields && unavailableFields.indexOf(key) !== -1;
    if (missing || val === null || val === undefined || val === '') return '<span class="pl-unavailable">Not available</span>';
    return esc(formatted !== undefined ? formatted : val);
  }

  function render(p) {
    var unavailable = p.unavailableFields || [];
    // Current club logo: saved value, or (if missing) the logo of that club in the transfer list.
    var clubBadge = p.currentClubBadge || null;
    if (!clubBadge && p.currentClub && p.transfers) {
      var cc = String(p.currentClub).toLowerCase();
      for (var i = 0; i < p.transfers.length; i++) {
        var t0 = p.transfers[i];
        if (t0.toClub && String(t0.toClub).toLowerCase() === cc && t0.toBadge) { clubBadge = t0.toBadge; break; }
      }
    }
    var ageDob = [];
    if (p.age) ageDob.push(p.age + ' yrs');
    if (p.dateOfBirth) ageDob.push(fmtDate(p.dateOfBirth));
    var ageDobStr = ageDob.length ? ageDob.join(' &middot; ') : null;

    function dateOf(v){ if(!v) return '\u2014'; return /^\d{4}$/.test(String(v)) ? String(v) : (fmtDate(v) || '\u2014'); }
    var rows = (p.transfers || []).filter(function(t){
      return !(t.fromClub && t.toClub && String(t.fromClub).toLowerCase() === String(t.toClub).toLowerCase());
    });
    var transfersHtml = rows.length
      ? rows.map(function(t){
          return '<div class="pl-tr">' +
            '<div class="date">' + esc(dateOf(t.date)) + '</div>' +
            '<div class="club">' + (t.fromClub ? logoHtml(t.fromBadge, true) : '') + '<span>' + esc(t.fromClub || '\u2014') + '</span></div>' +
            '<div class="arrow">&rarr;</div>' +
            '<div class="club">' + logoHtml(t.toBadge, true) + '<span>' + esc(t.toClub || '\u2014') + '</span></div>' +
            '<div class="fee">' + esc(t.fee || t.type || '\u2014') + '</div>' +
          '</div>';
        }).join('')
      : '<div class="pl-tr"><span class="pl-unavailable">No transfer history available.</span></div>';

    root.innerHTML =
      '<div class="pl-hero">' +
        '<div class="pl-photo-wrap">' +
          (p.photoUrl ? '<img src="' + esc(p.photoUrl) + '" alt="" onerror="this.style.display=\'none\'">' : '<span class="pl-ini">' + esc(initialsOf(p.name)) + '</span>') +
        '</div>' +
        '<div class="pl-head-text">' +
          (p.position ? '<span class="pl-pos-badge">' + esc(p.position) + '</span>' : '') +
          '<h1 class="pl-name display">' + esc(p.name) + '</h1>' +
          '<div class="pl-sub">' +
            (p.currentClub ? logoHtml(clubBadge) + '<b>' + esc(p.currentClub) + '</b>' : '<span class="pl-unavailable">Current club not available</span>') +
            (p.nationality ? ' &middot; ' + esc(p.nationality) : '') +
            (ageDobStr ? ' &middot; ' + ageDobStr : '') +
          '</div>' +
        '</div>' +
        (p.shirtNumber ? '<div class="pl-shirt">' + jerseySvg(p.shirtNumber) + '</div>' : '') +
      '</div>' +

      '<div class="pl-grid">' +
        '<div class="pl-card"><div class="lbl">Current Club</div><div class="val' + (p.currentClub?'':' muted') + '"><span>' + fieldVal(p.currentClub, unavailable, 'currentClub') + '</span>' + (p.currentClub ? logoHtml(clubBadge) : '') + '</div></div>' +
        '<div class="pl-card"><div class="lbl">Shirt Number</div><div class="val' + (p.shirtNumber?'':' muted') + '">' + fieldVal(p.shirtNumber, unavailable, 'shirtNumber', p.shirtNumber ? ('#' + p.shirtNumber) : null) + '</div></div>' +
        '<div class="pl-card"><div class="lbl">Nationality</div><div class="val' + (p.nationality?'':' muted') + '"><span>' + fieldVal(p.nationality, unavailable, 'nationality') + '</span>' + (p.nationality ? flagHtml(p.nationality) : '') + '</div></div>' +
        '<div class="pl-card"><div class="lbl">Market Value</div><div class="val' + (p.marketValue?'':' muted') + '">' + fieldVal(p.marketValue, unavailable, 'marketValue') + '</div><div class="note">' + (p.marketValue ? esc(p.marketValueNote || '') : 'Not provided by the current data source.') + '</div></div>' +
      '</div>' +

      positionSectionHtml(p) +

      '<div class="pl-section">' +
        '<h2 class="display">Transfer History</h2>' +
        '<div class="pl-transfers">' + transfersHtml + '</div>' +
      '</div>' +

      '<div class="pl-footnote">Data sourced from TheSportsDB, a community-maintained football database, and refreshed periodically. Transfer history shows clubs and years only (no fees).' +
      (p.lastUpdated ? ' Last updated ' + esc(fmtDate(p.lastUpdated)) + '.' : '') +
      ' Fields marked &ldquo;Not available&rdquo; could not be retrieved from the current source.</div>';
  }


  /* ---- clubs become links: our own club page if there is one, otherwise the generic club page ---- */
  var CL_STRIP = /\b(fc|afc|cf|sc|ac|as|ssc|ud|cd|sv|vfb|vfl|fsv|rcd|rc|calcio|club|de|fk|bk|sk|ss)\b/g;
  function clNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
  function clStrip(s){ return clNorm(s).replace(CL_STRIP,' ').replace(/\s+/g,' ').trim(); }
  function clDirectory(){
    try { var c = JSON.parse(sessionStorage.getItem('fs-club-dir-v1') || 'null'); if (c && c.d && c.d.length && Date.now() - c.t < 864e5) return Promise.resolve(c.d); } catch(e){}
    return fetch('/api/player?clubs=1').then(function(r){ return r.json(); }).then(function(j){
      var d = j && j.ok ? j.clubs : [];
      if (d.length) try { sessionStorage.setItem('fs-club-dir-v1', JSON.stringify({t: Date.now(), d: d})); } catch(e){}
      return d;
    }).catch(function(){ return []; });
  }
  function linkClubs(){
    var els = root.querySelectorAll('.pl-tr .club span, .pl-sub b, .pl-card:first-child .val span');
    if (!els.length) return;
    clDirectory().then(function(dir){
      var byName = {};
      dir.forEach(function(c){ [c.n, c.s].forEach(function(n){ if (n) { byName[clNorm(n)] = c; byName['~' + clStrip(n)] = c; } }); });
      var META = window.FSClubMeta;
      function hrefFor(nm){
        if (!nm || /^(free agent|retired|—)$/i.test(nm)) return null;
        var own = META && META.findClub ? META.findClub(nm) : null;
        if (own) return own.slug + '.html';
        var c = byName[clNorm(nm)] || (clStrip(nm).length >= 4 ? byName['~' + clStrip(nm)] : null);
        if (!c) return null;
        if (META) for (var s in META.CLUBS) if (META.CLUBS[s].id === c.i) return s + '.html';
        return 'club.html?id=' + c.i;
      }
      Array.prototype.forEach.call(els, function(el){
        if (el.querySelector('a')) return;
        var nm = el.textContent.trim(), h = hrefFor(nm);
        if (!h) return;
        el.innerHTML = '<a class="pl-clublink" href="' + esc(h) + '">' + esc(nm) + '</a>';
      });
    });
  }

  function renderError(msg) {
    root.innerHTML = '<div class="pl-state"><div class="display">Player data unavailable</div><p>' + esc(msg) + '</p></div>';
  }

  var url = '/api/player?name=' + encodeURIComponent(name) + (club ? '&club=' + encodeURIComponent(club) : '');
  fetch(url).then(function(r){ return r.json(); }).then(function(res){
    if (!res || !res.ok || !res.player) { renderError((res && res.error) || 'This player could not be found.'); return; }
    render(res.player);
    try { linkClubs(); } catch (e) {}
  }).catch(function(){
    renderError('Something went wrong loading this player. Please try again shortly.');
  });
})();
</script>

<script src="player-search.js"></script>
</body>
</html>
