<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

html[data-theme="light"] header{ background:rgba(255,255,255,0.86); }

/* ---- top bar (old, unused) ---- */

}

.pitch-h-wrap{ overflow-x:auto; }
.pitch-h{
  position:relative; width:100%; min-width:760px; aspect-ratio:1.65;
  background-color:#189a57;
  background-image:repeating-linear-gradient(90deg,
    rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 48px,
    rgba(0,0,0,0.045) 48px, rgba(0,0,0,0.045) 96px);
}
.pitch-h::before{
  content:""; position:absolute; left:50%; top:0; bottom:0; width:1.5px; background:rgba(255,255,255,0.45);
}
.pitch-h::after{
  content:""; position:absolute; left:50%; top:50%; width:84px; height:84px;
  border:1.5px solid rgba(255,255,255,0.45); border-radius:50%; transform:translate(-50%,-50%);
}
.pitch-box-h{ position:absolute; top:50%; transform:translateY(-50%); width:9%; height:46%; border:1.5px solid rgba(255,255,255,0.45); }
.pitch-box-h.left{ left:0; border-left:none; }
.pitch-box-h.right{ right:0; border-right:none; }
.pitch-goal-h{ position:absolute; top:50%; transform:translateY(-50%); width:3.4%; height:20%; border:1.5px solid rgba(255,255,255,0.45); }
.pitch-goal-h.left{ left:0; border-left:none; }
.pitch-goal-h.right{ right:0; border-right:none; }

.player-h{
  left:var(--player-longitudinal);top:var(--player-lateral);
  position:absolute; transform:translate(-50%,-50%);

/* Responsive lineups: switch the actual formation axes when the pitch narrows.
   Wide screens retain the original horizontal pitch and player layout. */
@media (max-width: 720px){
  .pitch-h-wrap{overflow-x:hidden}
  .pitch-h{
    width:100%;min-width:0;
    aspect-ratio:auto;height:clamp(710px,175vw,900px);
    background-image:repeating-linear-gradient(0deg,
      rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 48px,
      rgba(0,0,0,.045) 48px,rgba(0,0,0,.045) 96px);
  }
  .pitch-h::before{
    left:0;right:0;top:50%;bottom:auto;width:auto;height:1.5px;
  }
  .pitch-h::after{width:64px;height:64px}
  .pitch-box-h{
    top:auto;left:50%;right:auto;transform:translateX(-50%);
    width:54%;height:8%;
  }
  .pitch-box-h.left{top:0;left:50%;border:1.5px solid rgba(255,255,255,.45);border-top:0}
  .pitch-box-h.right{bottom:0;right:auto;border:1.5px solid rgba(255,255,255,.45);border-bottom:0}
  .pitch-goal-h{
    top:auto;left:50%;right:auto;transform:translateX(-50%);
    width:26%;height:3%;
  }

  .pitch-goal-h.right{bottom:0;right:auto;border:1.5px solid rgba(255,255,255,.45);border-bottom:0}
  /* Preserve team direction and row order: horizontal X becomes vertical Y. */
  .pitch-h .player-h{
    left:var(--portrait-lateral,var(--player-lateral));top:var(--portrait-longitudinal,var(--player-longitudinal));
    width:clamp(52px,19vw,76px);
  }
  .pitch-h .player-h .avatar-wrap,
  .pitch-h .player-h .avatar,
  .pitch-h .player-h .avatar-fallback{width:clamp(34px,11vw,46px);height:clamp(34px,11vw,46px)}
  .pitch-h .player-h .pname{font-size:10px;max-width:76px}
  .pitch-formation-row{padding:11px 9px;gap:6px}

/* =====================================================================
   FOOTBALL STORIES 96 — LIGHT MODE
   Scoped entirely under html[data-theme="light"] so the dark theme
   (driven by the original :root variables above) stays the default
   and completely untouched.
   ===================================================================== */

html[data-theme="light"]{
  --black:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F6F6F8;
  --line:#E5E5EA;
  --white:#111116;
  --muted:#55555F;
  --purple:#7B2CFF;
  --purple-bright:#6420D6;
  --orange:#FF6A00;
  --orange-bright:#E85A00;
}

/* ---- theme toggle button (same markup/classes on every page) ---- */
.theme-toggle{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--white);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:border-color .2s ease, color .2s ease, background .2s ease, transform .15s ease;
}
.theme-toggle:hover{ border-color:var(--purple-bright); color:var(--purple-bright); transform:translateY(-1px); }
.theme-toggle .ti-moon{ display:block; }
.theme-toggle .ti-sun{ display:none; }
html[data-theme="light"] .theme-toggle .ti-moon{ display:none; }
html[data-theme="light"] .theme-toggle .ti-sun{ display:block; }

/* ---- glass header / topbars: light instead of black ---- */
html[data-theme="light"] header,
html[data-theme="light"] .club-topbar,
html[data-theme="light"] .match-topbar{
  background:rgba(255,255,255,0.86);
}

/* ---- nav CTA + home link ---- */
html[data-theme="light"] .nav-cta{ background:var(--purple); color:#fff; }
html[data-theme="light"] .nav-cta:hover{ background:var(--orange); }
html[data-theme="light"] .nav-home{ color:var(--muted); }
html[data-theme="light"] .nav-home:hover{ color:var(--white); }

/* ---- hero ---- */
html[data-theme="light"] .hero-bg{
  background:
    radial-gradient(ellipse 60% 50% at 18% 25%, rgba(123,44,255,0.14), transparent 60%),
    radial-gradient(ellipse 55% 45% at 88% 70%, rgba(255,106,0,0.13), transparent 60%),
    linear-gradient(180deg, #FFFFFF 0%, #F6F6F8 100%);
}
html[data-theme="light"] .grain{ opacity:0.025; }
html[data-theme="light"] .hero h1{
  background:linear-gradient(100deg, #111116 40%, var(--purple-bright) 75%, var(--orange-bright) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
html[data-theme="light"] .btn-ghost{ border-color:rgba(17,17,22,0.16); }
html[data-theme="light"] .btn-ghost:hover{ background:rgba(255,106,0,0.06); }
html[data-theme="light"] .channel-badge img{ border-color:rgba(17,17,22,0.12); }

/* ---- section heads ---- */
html[data-theme="light"] .section-head h2{ color:var(--white); }

/* ---- soft card shadows (per brief: very soft, no heavy shadow) ---- */

<body class="match-page-body">

<script src="site-header.js"></script>

<div class="wrap">
  <div class="match-head-card" id="matchHeadCard">
    <div class="state-msg">Loading match&hellip;</div>
  </div>
  <div class="match-nav" id="matchNav"></div>

  <div id="lineupsBody"></div>
</div>

<script>
function qsParam(name){ return new URLSearchParams(location.search).get(name); }
const MATCH_ID = qsParam('id');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

async function fetchMatch(type){
  const res = await fetch('/api/match?id=' + encodeURIComponent(MATCH_ID) + '&type=' + type);
  return res.json();
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = function(n){ return String(n).padStart(2,'0'); };
  return days[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() +
    ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function statusText(s){
  if (!s) return '';
  if (['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1){
    return (s.elapsed ? s.elapsed + "'" : 'LIVE');
  }
  if (s.short === 'HT') return 'Half-time';
  if (['FT','AET','PEN'].indexOf(s.short) !== -1) return 'Full-time';
  if (s.short === 'NS') return 'Not started';
  if (['PST','CANC','ABD'].indexOf(s.short) !== -1) return s.long || s.short;
  return s.long || s.short;
}

function isLiveStatus(s){
  return s && ['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1;
}

// Renders the shared match header + nav tabs at the top of every page.
// activePage is one of: summary, events, lineups, statistics, players, table
function renderMatchChrome(activePage, summary){
  const nav = [
    ['summary', 'Summary', 'match.html'],
    ['events', 'Events', 'match-events.html'],
    ['lineups', 'Lineups', 'match-lineups.html'],
    ['statistics', 'Statistics', 'match-statistics.html'],
    ['players', 'Players', 'match-players.html'],
    ['table', 'Table', 'match-table.html'],
  ];
  const navHtml = nav.map(function(n){
    return '<a href="' + n[2] + '?id=' + encodeURIComponent(MATCH_ID) + '"' +
      (n[0] === activePage ? ' class="active"' : '') + '>' + n[1] + '</a>';
  }).join('');

  let headHtml = '';
  if (summary){
    const live = isLiveStatus(summary.status);
    const homeScore = (summary.goals.home === null || summary.goals.home === undefined) ? '-' : summary.goals.home;
    const awayScore = (summary.goals.away === null || summary.goals.away === undefined) ? '-' : summary.goals.away;
    let subLine = '';
    if (summary.halftime) subLine += 'HT ' + summary.halftime.home + '-' + summary.halftime.away + '  ';
    if (summary.extratime) subLine += 'AET ' + summary.extratime.home + '-' + summary.extratime.away + '  ';
    if (summary.penalty) subLine += 'Pens ' + summary.penalty.home + '-' + summary.penalty.away;

    const metaParts = [];
    metaParts.push('<span>' + escapeHtml(fmtDateTime(summary.date)) + '</span>');
    if (summary.venue) metaParts.push('<span>' + escapeHtml(summary.venue.name) + (summary.venue.city ? ', ' + escapeHtml(summary.venue.city) : '') + '</span>');
    if (summary.referee) metaParts.push('<span>Referee: <strong>' + escapeHtml(summary.referee) + '</strong></span>');
    if (summary.league.round) metaParts.push('<span>' + escapeHtml(summary.league.round) + '</span>');

    headHtml =
      '<div class="match-head-top">' + (summary.league.logo ? '<img src="' + summary.league.logo + '" alt="" />' : '') +
        escapeHtml(summary.league.name) + '</div>' +
      '<div class="match-head-teams">' +
        '<div class="match-head-team">' + (summary.home.logo ? '<img src="' + summary.home.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.home.name) + '</div></div>' +
        '<div class="match-head-score">' +
          '<div class="score">' + homeScore + ' &ndash; ' + awayScore + '</div>' +
          '<div class="status' + (live ? ' live' : '') + '">' + (live ? '<span class="dot"></span>' : '') + escapeHtml(statusText(summary.status)) + '</div>' +
        '</div>' +
        '<div class="match-head-team">' + (summary.away.logo ? '<img src="' + summary.away.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.away.name) + '</div></div>' +
      '</div>' +
      (subLine ? '<div class="match-head-sub">' + escapeHtml(subLine.trim()) + '</div>' : '') +
      (metaParts.length ? '<div class="match-head-meta">' + metaParts.join('') + '</div>' : '');
  }

  document.getElementById('matchHeadCard').innerHTML = headHtml || '<div class="state-msg">Match not found.</div>';
  document.getElementById('matchNav').innerHTML = navHtml;
}

function showState(container, msg, isError){
  container.innerHTML = '<div class="state-msg' + (isError ? ' error' : '') + '">' + escapeHtml(msg) + '</div>';
}

</script>
<script>
let lineupsData = null;
let ratingMap = {};   // playerId -> numeric rating (string from API, e.g. "7.4")
let photoMap = {};    // playerId -> photo URL
let eventMap = {};    // playerId -> { goals, assists }
let cameOnMinutes = {}; // playerId -> minute they came on, for substitutes
let wentOffMinutes = {}; // playerId -> minute a starter was substituted off
let motmPlayerId = null; // id of the single highest-rated player in the match

// The Man of the Match badge (blue, with a star) goes to whichever player
// -- starter or substitute, either team -- has the single highest rating
// in the match, once the game has ratings at all.
function computeMotm(){
  let best = null, bestRating = -Infinity;
  Object.keys(ratingMap).forEach(function(id){
    if (ratingMap[id] > bestRating){ bestRating = ratingMap[id]; best = id; }
  });
  motmPlayerId = best;
}

(async function(){
  const body = document.getElementById('lineupsBody');
  if (!MATCH_ID){
    document.getElementById('matchHeadCard').innerHTML = '<div class="state-msg error">No match selected.</div>';
    document.getElementById('matchNav').innerHTML = '';
    return;
  }
  showState(body, 'Loading lineups…', false);
  try {
    const [summaryRes, lineupsRes, playersRes, eventsRes] = await Promise.all([
      fetchMatch('summary'), fetchMatch('lineups'), fetchMatch('players'), fetchMatch('events')
    ]);
    renderMatchChrome('lineups', summaryRes.ok ? summaryRes.data : null);

    if (!lineupsRes.ok){
      showState(body, lineupsRes.error || 'Could not load lineups.', true);
      return;
    }
    lineupsData = lineupsRes.data;
    if (!lineupsData.length || !lineupsData[0].startXI || !lineupsData[0].startXI.length){
      showState(body, 'Lineups have not been announced yet for this match.', false);
      return;
    }

    if (playersRes.ok){
      playersRes.data.forEach(function(team){
        team.players.forEach(function(p){
          if (p.rating) ratingMap[p.id] = parseFloat(p.rating);
          if (p.photo) photoMap[p.id] = p.photo;
        });
      });
    }
    if (eventsRes.ok){
      eventsRes.data.forEach(function(e){
        if (e.type === 'subst' && e.player){
          // For "subst" events, `player` is who came ON, `assist` is who
          // went off (API-Football's convention for this event type).
          cameOnMinutes[e.player.id] = e.minute;
          if (e.assist) wentOffMinutes[e.assist.id] = e.minute;
        }
        if (!e.player) return;
        if (!eventMap[e.player.id]) eventMap[e.player.id] = { goals: 0, assists: 0 };
        if (e.type === 'goal' && e.detail !== 'Missed Penalty') eventMap[e.player.id].goals++;
        if (e.assist) {
          if (!eventMap[e.assist.id]) eventMap[e.assist.id] = { goals: 0, assists: 0 };
          eventMap[e.assist.id].assists++;
        }
      });
    }

    computeMotm();
    render();
  } catch(e){
    renderMatchChrome('lineups', null);
    showState(body, 'Match details are temporarily unavailable. Please try again shortly.', true);
  }
})();

function ratingBadgeClass(rating){
  if (rating === undefined) return null;
  if (rating >= 7.0) return 'r-green';
  if (rating >= 5.0) return 'r-orange';
  return 'r-red';
}

function initials(name){
  const parts = name.split(' ');
  return ((parts[0] || '')[0] || '') + ((parts[parts.length-1] || '')[0] || '');
}

function avatarHtml(p){
  const photo = photoMap[p.id];
  if (photo) return '<img class="avatar" src="' + photo + '" alt="" />';
  return '<div class="avatar-fallback">' + escapeHtml(initials(p.name).toUpperCase()) + '</div>';
}

// Rating pill (top-right on the pitch marker): exceptional (>=9.0) ratings
// get a star alongside the blue tier, per the design's "9.7 ★" style.
function badgeHtml(p){
  const r = ratingMap[p.id];
  if (r === undefined) return '';
  const isMotm = motmPlayerId !== null && String(p.id) === String(motmPlayerId);
  const cls = isMotm ? 'r-blue' : ratingBadgeClass(r);
  if (!cls) return '';
  const star = isMotm ? ' \u2605' : '';
  return '<span class="badge ' + cls + '">' + r.toFixed(1) + star + '</span>';
}

// Substitution indicator (top-left, red circle + white left arrow) plus
// the minute label shown above the avatar -- only for a starter who was
// subbed off; the incoming substitute is listed separately below the pitch.
function subBadgeHtml(p){
  if (wentOffMinutes[p.id] === undefined) return '';
  return '<span class="sub-badge">&larr;</span>';
}
function subOffMinuteHtml(p){
  if (wentOffMinutes[p.id] === undefined) return '';
  return '<div class="sub-off-min">' + wentOffMinutes[p.id] + "'</div>";
}

// Bottom-left: captain badge takes priority over the assist badge when a
// player is both (only one slot available there).
function capOrAssistHtml(p){
  if (p.captain) return '<span class="cap">C</span>';
  const ev = eventMap[p.id];
  if (ev && ev.assists) return '<span class="assist-badge">\ud83d\udc5f</span>';
  return '';
}

// Bottom-right: one stacked ball icon per goal scored.
function goalsHtml(p){
  const ev = eventMap[p.id];
  if (!ev || !ev.goals) return '';
  let icons = '';
  for (let i = 0; i < ev.goals; i++) icons += '<span class="ic">\u26bd</span>';
  return '<div class="goals">' + icons + '</div>';
}

// Position-based fallback row, used only when the API doesn't give us a
// "grid" (row:col) for a player -- this previously defaulted everyone
// without grid data to row 1 (goalkeeper's row), which is what could send
// an outfield player -- like a striker -- to the wrong end of their own
// side. G=row1 (own goal) through F=furthest forward.
const FALLBACK_ROW_BY_POS = { G: 1, D: 2, M: 3, F: 4 };

function placeTeam(team, side){
  const rows = {};
  team.startXI.forEach(function(p){
    let row = 1, col = 1;
    if (p.grid){
      const parts = p.grid.split(':');
      row = parseInt(parts[0], 10) || 1;
      col = parseInt(parts[1], 10) || 1;
    } else {
      row = FALLBACK_ROW_BY_POS[p.pos] || 2;
    }
    if (!rows[row]) rows[row] = [];
    rows[row].push(Object.assign({}, p, { col: col }));
  });
  const rowKeys = Object.keys(rows).map(Number).sort(function(a,b){ return a - b; });
  const maxRow = rowKeys.length;
  // Columns are spread across a wide band (6%-47%) of each team's own half
  // of the pitch, so rows never crowd into the centre circle or overlap
  // the other team, and there's enough gap between markers for the
  // (now larger) avatars and name labels to breathe.
  const MIN_X = 8, MAX_X = 37; // reserve more room between teams at midfield
  let markers = '';
  rowKeys.forEach(function(rowNum, idx){
    const rowPlayers = rows[rowNum].sort(function(a,b){ return a.col - b.col; });
    const cols = rowPlayers.length;
    const frac = maxRow <= 1 ? 0 : idx / (maxRow - 1);
    let x;
    if (side === 'home'){
      x = MIN_X + frac * (MAX_X - MIN_X);
    } else {
      x = (100 - MIN_X) - frac * (MAX_X - MIN_X);
    }
    rowPlayers.forEach(function(p, ci){
      // Wider pitch rows use available height, while portrait retains its approved layout.
      const portraitY = 9 + ((ci + 1) / (cols + 1)) * 82;
      const y = cols === 1 ? 50 : 10 + ci * 80 / (cols - 1);
      const portraitX = side === 'home'
        ? MIN_X + frac * (42 - MIN_X)
        : (100 - MIN_X) - frac * (42 - MIN_X);
      markers += '<div class="player-h" data-fs-player="' + encodeURIComponent(p.name || '') + '" style="--player-longitudinal:' + x + '%;--player-lateral:' + y + '%;--portrait-longitudinal:' + portraitX + '%;--portrait-lateral:' + portraitY + '%;">' +
        subOffMinuteHtml(p) +
        '<div class="avatar-wrap">' + avatarHtml(p) + badgeHtml(p) + subBadgeHtml(p) +
          capOrAssistHtml(p) + goalsHtml(p) +
        '</div>' +
        '<div class="pname">' + escapeHtml((p.name || '').split(' ').slice(-1)[0]) + '</div>' +
      '</div>';
    });
  });
  return markers;
}

function teamAvgRating(team){
  const ratings = team.startXI.map(function(p){ return ratingMap[p.id]; }).filter(function(r){ return r !== undefined; });
  if (!ratings.length) return null;
  return (ratings.reduce(function(a,b){ return a+b; }, 0) / ratings.length).toFixed(1);
}

function coachHtml(team, side){
  const c = team.coach;
  const inner = c
    ? ((c.photo ? '<img src="' + c.photo + '" alt="" />' : '<div class="coach-avatar-fallback">' + escapeHtml(initials(c.name || '?').toUpperCase()) + '</div>') +
       '<span class="coach-name">' + escapeHtml(c.name) + '</span>')
    : '<span class="coach-name">&mdash;</span>';
  return '<div class="coach' + (side === 'away' ? ' away' : '') + '">' + inner + '</div>';
}

function positionLabel(pos){
  const labels = { G:'Goalkeeper', GK:'Goalkeeper', D:'Defender', DF:'Defender', M:'Midfielder', MF:'Midfielder', F:'Attacker', FW:'Attacker', A:'Attacker' };
  return labels[String(pos || '').toUpperCase()] || pos || '';
}
function subsListHtml(team, section){
  const cameOn = team.substitutes.filter(function(p){ return cameOnMinutes[p.id] !== undefined; });
  const bench = team.substitutes.filter(function(p){ return cameOnMinutes[p.id] === undefined; });

  function row(p, showRating){
    const r = ratingMap[p.id];
    const isMotm = r !== undefined && motmPlayerId !== null && String(p.id) === String(motmPlayerId);
    const cls = isMotm ? 'r-blue' : ratingBadgeClass(r);
    const star = isMotm ? ' \u2605' : '';
    return '<div class="subs-row" data-fs-player="' + encodeURIComponent(p.name || '') + '">' +
      (photoMap[p.id] ? '<img class="avatar" src="' + photoMap[p.id] + '" alt="" />' : '<div class="avatar-fallback">' + escapeHtml(initials(p.name).toUpperCase()) + '</div>') +
      (showRating && r !== undefined ? '<span class="rating-badge ' + cls + '">' + r.toFixed(1) + star + '</span>' : '') +
      '<div class="info"><div class="name">' + escapeHtml(p.name) + '</div>' +
        (p.pos ? '<div class="pos">' + escapeHtml(positionLabel(p.pos)) + '</div>' : '') + '</div>' +
      (cameOnMinutes[p.id] !== undefined ? '<div class="minute">' + cameOnMinutes[p.id] + "' \u2192</div>" : '') +
    '</div>';
  }

  const players = section === 'substitutes' ? cameOn : bench;
  const title = section === 'substitutes' ? 'Substitutes' : 'Bench';
  return '<div class="subs-section' + (!players.length ? ' subs-section--empty' : '') + '">' +
    '<div class="subs-section-head">' + title + '</div>' +
    players.map(function(p){return row(p, section === 'substitutes');}).join('') +
    '</div>';
}

function ratingBadgeClassFromValue(v){
  return ratingBadgeClass(parseFloat(v));
}

function render(){
  const body = document.getElementById('lineupsBody');
  const home = lineupsData[0], away = lineupsData[1];
  const homeAvg = teamAvgRating(home), awayAvg = teamAvgRating(away);

  const pitchHtml =
    '<div class="pitch-card">' +
      '<div class="pitch-formation-row">' +
        '<div class="side home">' +
          (homeAvg ? '<span class="pitch-rating-chip ' + ratingBadgeClassFromValue(homeAvg) + '">' + homeAvg + '</span>' : '') +
          (home.team.logo ? '<img class="team-logo" src="' + home.team.logo + '" alt="" />' : '') +
          '<span><div class="team-name">' + escapeHtml(home.team.name) + '</div>' +
            (home.formation ? '<div class="formation">' + escapeHtml(home.formation) + '</div>' : '') + '</span>' +
        '</div>' +
        '<div class="side away">' +
          (awayAvg ? '<span class="pitch-rating-chip ' + ratingBadgeClassFromValue(awayAvg) + '">' + awayAvg + '</span>' : '') +
          (away.team.logo ? '<img class="team-logo" src="' + away.team.logo + '" alt="" />' : '') +
          '<span><div class="team-name">' + escapeHtml(away.team.name) + '</div>' +
            (away.formation ? '<div class="formation">' + escapeHtml(away.formation) + '</div>' : '') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="pitch-h-wrap"><div class="pitch-h">' +
        '<div class="pitch-box-h left"></div><div class="pitch-box-h right"></div>' +
        '<div class="pitch-goal-h left"></div><div class="pitch-goal-h right"></div>' +
        placeTeam(home, 'home') + placeTeam(away, 'away') +
      '</div></div>' +
      '<div class="pitch-coach-row">' + coachHtml(home, 'home') +
        '<span class="coach-label">Coach</span>' + coachHtml(away, 'away') +
      '</div>' +
    '</div>';

  body.innerHTML = pitchHtml +
    '<div class="subs-grid">' +
      subsListHtml(home, 'substitutes') +
      subsListHtml(away, 'substitutes') +
      subsListHtml(home, 'bench') +
      subsListHtml(away, 'bench') +
    '</div>';
}

</script>

<script src="club-links.js" defer></script>
<script src="player-search.js"></script>
