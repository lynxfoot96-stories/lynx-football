<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

  <div class="match-head-card" id="matchHeadCard">

<script>
function qsParam(name){ return new URLSearchParams(location.search).get(name); }
const MATCH_ID = qsParam('id');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

async function fetchMatch(type){
  const res = await fetch('/api/match?id=' + encodeURIComponent(MATCH_ID) + '&type=' + type);
  return res.json();
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = function(n){ return String(n).padStart(2,'0'); };
  return days[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear() +
    ' \u00b7 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function statusText(s){
  if (!s) return '';
  if (['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1){
    return (s.elapsed ? s.elapsed + "'" : 'LIVE');
  }
  if (s.short === 'HT') return 'Half-time';
  if (['FT','AET','PEN'].indexOf(s.short) !== -1) return 'Full-time';
  if (s.short === 'NS') return 'Not started';
  if (['PST','CANC','ABD'].indexOf(s.short) !== -1) return s.long || s.short;
  return s.long || s.short;
}

function isLiveStatus(s){
  return s && ['1H','2H','ET','BT','P','LIVE'].indexOf(s.short) !== -1;
}

// Renders the shared match header + nav tabs at the top of every page.
// activePage is one of: summary, events, lineups, statistics, players, table
function renderMatchChrome(activePage, summary){
  const nav = [
    ['summary', 'Summary', 'match.html'],
    ['events', 'Events', 'match-events.html'],
    ['lineups', 'Lineups', 'match-lineups.html'],
    ['statistics', 'Statistics', 'match-statistics.html'],
    ['players', 'Players', 'match-players.html'],
    ['table', 'Table', 'match-table.html'],
  ];
  const navHtml = nav.map(function(n){
    return '<a href="' + n[2] + '?id=' + encodeURIComponent(MATCH_ID) + '"' +
      (n[0] === activePage ? ' class="active"' : '') + '>' + n[1] + '</a>';
  }).join('');

  let headHtml = '';
  if (summary){
    const live = isLiveStatus(summary.status);
    const homeScore = (summary.goals.home === null || summary.goals.home === undefined) ? '-' : summary.goals.home;
    const awayScore = (summary.goals.away === null || summary.goals.away === undefined) ? '-' : summary.goals.away;
    let subLine = '';
    if (summary.halftime) subLine += 'HT ' + summary.halftime.home + '-' + summary.halftime.away + '  ';
    if (summary.extratime) subLine += 'AET ' + summary.extratime.home + '-' + summary.extratime.away + '  ';
    if (summary.penalty) subLine += 'Pens ' + summary.penalty.home + '-' + summary.penalty.away;

    const metaParts = [];
    metaParts.push('<span>' + escapeHtml(fmtDateTime(summary.date)) + '</span>');
    if (summary.venue) metaParts.push('<span>' + escapeHtml(summary.venue.name) + (summary.venue.city ? ', ' + escapeHtml(summary.venue.city) : '') + '</span>');
    if (summary.referee) metaParts.push('<span>Referee: <strong>' + escapeHtml(summary.referee) + '</strong></span>');
    if (summary.league.round) metaParts.push('<span>' + escapeHtml(summary.league.round) + '</span>');

    headHtml =
      '<div class="match-head-top">' + (summary.league.logo ? '<img src="' + summary.league.logo + '" alt="" />' : '') +
        escapeHtml(summary.league.name) + '</div>' +
      '<div class="match-head-teams">' +
        '<div class="match-head-team">' + (summary.home.logo ? '<img src="' + summary.home.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.home.name) + '</div></div>' +
        '<div class="match-head-score">' +
          '<div class="score">' + homeScore + ' &ndash; ' + awayScore + '</div>' +
          '<div class="status' + (live ? ' live' : '') + '">' + (live ? '<span class="dot"></span>' : '') + escapeHtml(statusText(summary.status)) + '</div>' +
        '</div>' +
        '<div class="match-head-team">' + (summary.away.logo ? '<img src="' + summary.away.logo + '" alt="" />' : '') +
          '<div class="name display">' + escapeHtml(summary.away.name) + '</div></div>' +
      '</div>' +
      (subLine ? '<div class="match-head-sub">' + escapeHtml(subLine.trim()) + '</div>' : '') +
      (metaParts.length ? '<div class="match-head-meta">' + metaParts.join('') + '</div>' : '');
  }

  document.getElementById('matchHeadCard').innerHTML = headHtml || '<div class="state-msg error">Unable to load this match.</div>';
  document.getElementById('matchNav').innerHTML = navHtml;
}

function showState(container, msg, isError){
  container.innerHTML = '<div class="state-msg' + (isError ? ' error' : '') + '">' + escapeHtml(msg) + '</div>';
}

</script>
<script>
(async function(){
  const body = document.getElementById('eventsBody');

  // Missing or malformed id: never attempt a fetch, never show a broken
  // nav/header -- just a clear, actionable message with a way back.
  if (!MATCH_ID || !/^[0-9]+$/.test(MATCH_ID)){
    document.getElementById('matchHeadCard').innerHTML =
      '<div class="state-msg error">Unable to load this match.<br>No match was selected. <a href="index.html#scores">Go back to Scores</a>.</div>';
    document.getElementById('matchNav').innerHTML = '';
    return;
  }

  showState(body, 'Loading match events…', false);

  let summary = null;
  try {
    const [summaryRes, eventsRes] = await Promise.all([fetchMatch('summary'), fetchMatch('events')]);
    summary = summaryRes.ok ? summaryRes.data : null;
    renderMatchChrome('events', summary);

    if (!eventsRes.ok){
      showState(body, 'Unable to load match events.', true);
      return;
    }

    const events = eventsRes.data;

    if (!events.length){
      const notStarted = summary && summary.status && summary.status.short === 'NS';
      showState(
        body,
        notStarted ? 'No events yet. This match has not started.' : 'No events available for this match.',
        false
      );
      return;
    }

    const homeId = summary ? summary.home.id : null;

    function icon(e){
      if (e.type === 'goal') return '<span class="tl-icon goal">\u26bd</span>';
      if (e.type === 'card' && e.detail === 'Yellow Card') return '<span class="tl-icon card-yellow"></span>';
      if (e.type === 'card' && e.detail === 'Red Card' || e.type === 'card' && e.detail === 'Second Yellow card') return '<span class="tl-icon card-red"></span>';
      if (e.type === 'subst') return '<span class="tl-icon subst">\u21c4</span>';
      return '<span class="tl-icon var">\u2139</span>';
    }

    function bio(name){ return '<a class="fs-player-link" href="player.html?name=' + encodeURIComponent(name) + '">' + escapeHtml(name) + '</a>'; }
    function content(e){
      if (e.type === 'goal'){
        const player = e.player ? bio(e.player.name) : 'Goal';
        let tag = '';
        if (e.detail === 'Own Goal') tag = ' (OG)';
        if (e.detail === 'Penalty') tag = ' (Pen)';
        if (e.detail === 'Missed Penalty'){
          return '<div class="tl-text"><div class="ev-player out">Missed penalty</div>' +
            (e.player ? '<div class="ev-sub">' + player + '</div>' : '') + '</div>';
        }
        return '<div class="tl-text"><div class="ev-player">' + player + tag + '</div>' +
          (e.assist ? '<div class="ev-sub">Assist: ' + bio(e.assist.name) + '</div>' : '') + '</div>';
      }
      if (e.type === 'card'){
        return '<div class="tl-text"><div class="ev-player">' + (e.player ? bio(e.player.name) : '') + '</div></div>';
      }
      if (e.type === 'subst'){
        return '<div class="tl-text">' +
          (e.player ? '<div class="ev-player"><span class="in-tag">IN</span> ' + bio(e.player.name) + '</div>' : '') +
          (e.assist ? '<div class="ev-sub ev-player out"><span class="out-tag">OUT</span> ' + escapeHtml(e.assist.name) + '</div>' : '') +
        '</div>';
      }
      return '<div class="tl-text"><div class="ev-player">' + escapeHtml(e.detail || 'Event') + '</div></div>';
    }

    function minuteBlock(e){
      const parts = String(e.minute).split('+');
      return '<div class="tl-minute">' + parts[0] + "'" + (parts[1] ? '<span class="extra">+' + parts[1] + '</span>' : '') + '</div>';
    }

    let html = '<div class="timeline">';
    let htInserted = false;
    events.forEach(function(e){
      // Insert a half-time divider once, right before the first event whose
      // elapsed minute is past 45 -- using the real half-time score from
      // the summary endpoint (never fabricated).
      if (!htInserted && summary && summary.halftime){
        const elapsedNum = parseInt(String(e.minute).split('+')[0], 10);
        if (elapsedNum > 45){
          html += '<div class="tl-row"><div class="tl-divider"><span>HT ' + summary.halftime.home + ' - ' + summary.halftime.away + '</span></div></div>';
          htInserted = true;
        }
      }

      const isHome = homeId !== null && e.team && e.team.id === homeId;
      html += '<div class="tl-row">' +
        '<div class="tl-side left">' + (!isHome ? icon(e) + content(e) : '') + '</div>' +
        minuteBlock(e) +
        '<div class="tl-side right">' + (isHome ? icon(e) + content(e) : '') + '</div>' +
      '</div>';
    });
    html += '</div>';

    body.innerHTML = '<div class="events-title">Events</div>' + html;
  } catch(e){
    renderMatchChrome('events', summary);
    showState(body, 'Unable to load match events.', true);
  }
})();

</script>
