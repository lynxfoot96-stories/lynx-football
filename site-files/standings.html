<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var KEY='fs96-theme';
  var RX=/(?:^|;)\s*fs96-theme=(light|dark)/;
  /* Lit le thème : window.name d'abord (survit d'une page à l'autre dans
     le même onglet, même en ouvrant les fichiers en local file://),
     puis localStorage. */
  function read(){
    var m=RX.exec(window.name||'');
    if(m) return m[1];
    try{ var v=localStorage.getItem(KEY); if(v==='light'||v==='dark') return v; }catch(e){}
    return null;
  }
  function save(v){
    try{ localStorage.setItem(KEY,v); }catch(e){}
    window.name=(window.name||'').replace(/(?:^|;)\s*fs96-theme=(?:light|dark)/,'')+';fs96-theme='+v;
  }
  function apply(v){
    var root=document.documentElement;
    if(v==='light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
  }
  var saved=read();
  if(saved){ apply(saved); save(saved); } else { apply('light'); }
  document.addEventListener('DOMContentLoaded', function(){
    var btn=document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var goingLight=document.documentElement.getAttribute('data-theme')!=='light';
      var v=goingLight?'light':'dark';
      apply(v); save(v);
    });
  });
})();
</script>

/* =====================================================================
   FOOTBALL STORIES 96 — LIGHT MODE
   Scoped entirely under html[data-theme="light"] so the dark theme
   (driven by the original :root variables above) stays the default
   and completely untouched.
   ===================================================================== */

html[data-theme="light"]{
  --black:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F6F6F8;
  --line:#E5E5EA;
  --white:#111116;
  --muted:#55555F;
  --purple:#7B2CFF;
  --purple-bright:#6420D6;
  --orange:#FF6A00;
  --orange-bright:#E85A00;
}

/* ---- theme toggle button (same markup/classes on every page) ---- */
.theme-toggle{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--white);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:border-color .2s ease, color .2s ease, background .2s ease, transform .15s ease;
}
.theme-toggle:hover{ border-color:var(--purple-bright); color:var(--purple-bright); transform:translateY(-1px); }
.theme-toggle .ti-moon{ display:block; }
.theme-toggle .ti-sun{ display:none; }
html[data-theme="light"] .theme-toggle .ti-moon{ display:none; }
html[data-theme="light"] .theme-toggle .ti-sun{ display:block; }

/* ---- glass header / topbars: light instead of black ---- */
html[data-theme="light"] header,
html[data-theme="light"] .club-topbar,
html[data-theme="light"] .match-topbar{
  background:rgba(255,255,255,0.86);
}

/* ---- nav CTA + home link ---- */
html[data-theme="light"] .nav-cta{ background:var(--purple); color:#fff; }
html[data-theme="light"] .nav-cta:hover{ background:var(--orange); }
html[data-theme="light"] .nav-home{ color:var(--muted); }
html[data-theme="light"] .nav-home:hover{ color:var(--white); }

/* ---- hero ---- */
html[data-theme="light"] .hero-bg{
  background:
    radial-gradient(ellipse 60% 50% at 18% 25%, rgba(123,44,255,0.14), transparent 60%),
    radial-gradient(ellipse 55% 45% at 88% 70%, rgba(255,106,0,0.13), transparent 60%),
    linear-gradient(180deg, #FFFFFF 0%, #F6F6F8 100%);
}
html[data-theme="light"] .grain{ opacity:0.025; }
html[data-theme="light"] .hero h1{
  background:linear-gradient(100deg, #111116 40%, var(--purple-bright) 75%, var(--orange-bright) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
html[data-theme="light"] .btn-ghost{ border-color:rgba(17,17,22,0.16); }
html[data-theme="light"] .btn-ghost:hover{ background:rgba(255,106,0,0.06); }
html[data-theme="light"] .channel-badge img{ border-color:rgba(17,17,22,0.12); }

/* ---- section heads ---- */
html[data-theme="light"] .section-head h2{ color:var(--white); }

/* ---- soft card shadows (per brief: very soft, no heavy shadow) ---- */
html[data-theme="light"] .featured,
html[data-theme="light"] .video-card,
html[data-theme="light"] .news-card,
html[data-theme="light"] .contact-card,
html[data-theme="light"] .cat-tile,

<script>
function qsParam(name){ return new URLSearchParams(location.search).get(name); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ---- club links: logo / name -> club page (own page if we have one, else club.html?id=) ---- */
function clubHref(team){
  if (!team) return null;
  var M = window.FSClubMeta;
  if (M && M.CLUBS){
    for (var s in M.CLUBS){ if (M.isClubTeam(M.CLUBS[s], team)) return s + '.html'; }
  }
  return team.id ? 'club.html?id=' + encodeURIComponent(team.id) : null;
}

// Same six competitions, same cycle order, as the mini widget on matches.html.
const STANDINGS_LEAGUES = [
  { id: 39, name: 'Premier League', country: 'England', abbr: 'PL' },
  { id: 135, name: 'Serie A', country: 'Italy', abbr: 'SA' },
  { id: 78, name: 'Bundesliga', country: 'Germany', abbr: 'BL' },
  { id: 140, name: 'La Liga', country: 'Spain', abbr: 'LL' },
  { id: 61, name: 'Ligue 1', country: 'France', abbr: 'L1' },
  { id: 2, name: 'Champions League', country: 'Europe', abbr: 'UCL' },
  { id: 71, name: 'Brasileirão Série A', country: 'Brazil', abbr: 'BSA' },
  { id: 94, name: 'Primeira Liga', country: 'Portugal', abbr: 'PPL' },
];

const requestedId = Number(qsParam('league'));
let standingsIndex = STANDINGS_LEAGUES.findIndex(function(l){ return l.id === requestedId; });
if (standingsIndex === -1) standingsIndex = 0;
let seq = 0;

const leagueIdEl = document.getElementById('leagueId');
const tableWrap = document.getElementById('tableWrap');
const prevBtn = document.getElementById('switchPrev');
const nextBtn = document.getElementById('switchNext');
const leagueMenuBtn = document.getElementById('leagueMenuBtn');
const leagueMenuEl = document.getElementById('leagueMenu');

// ---- Table / Player Stats / News tabs ----
const pageNav = document.getElementById('pageNav');
const newsWrap = document.getElementById('newsWrap');
const statsWrap = document.getElementById('statsWrap');
const statsListWrap = document.getElementById('statsListWrap');
const tabPanels = { table: tableWrap, stats: statsWrap, news: newsWrap };

// Deep-link support: standings.html?league=2&tab=stats&stat=scorers opens
// straight on the Player Stats tab (e.g. from the homepage Top Scorers widget).
const requestedTab = qsParam('tab');
const requestedStat = qsParam('stat');
let activeTab = (requestedTab === 'stats' || requestedTab === 'news') ? requestedTab : 'table';
let activeStatType = requestedStat === 'assists' ? 'assists' : 'scorers'; // 'scorers' | 'assists'
let statsLoadedFor = null; // 'league:type' already fetched, avoids refetching on tab re-click
let statsSeq = 0;

if (activeTab !== 'table'){
  Array.from(pageNav.querySelectorAll('a[data-tab]')).forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-tab') === activeTab);
  });
  Object.keys(tabPanels).forEach(function(key){
    tabPanels[key].classList.toggle('active', key === activeTab);
  });
}
if (activeTab === 'stats'){
  Array.from(statsWrap.querySelectorAll('.stats-sub-btn')).forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-stat') === activeStatType);
  });
}

// ---- Competition quick-select dropdown (three-dot menu) ----
const leagueLogos = {};
function renderLeagueMenu(){
  leagueMenuEl.innerHTML = STANDINGS_LEAGUES.map(function(l, i){
    const logo = leagueLogos[l.id];
    const icon = logo
      ? '<img src="' + escapeHtml(logo) + '" alt="" />'
      : '<div class="lm-badge-fallback">' + escapeHtml(l.abbr) + '</div>';
    return '<div class="league-menu-item' + (i === standingsIndex ? ' is-active' : '') + '" role="menuitem" data-index="' + i + '">' +
      icon +
      '<div class="lm-text"><span class="lm-name">' + escapeHtml(l.name) + '</span>' +
      '<span class="lm-country">' + escapeHtml(l.country) + '</span></div>' +
    '</div>';
  }).join('');
}
function openLeagueMenu(){
  leagueMenuEl.classList.add('is-open');
  leagueMenuBtn.classList.add('is-open');
  leagueMenuBtn.setAttribute('aria-expanded', 'true');
}
function closeLeagueMenu(){
  leagueMenuEl.classList.remove('is-open');
  leagueMenuBtn.classList.remove('is-open');
  leagueMenuBtn.setAttribute('aria-expanded', 'false');
}
function switchToLeague(index){
  if (index === standingsIndex){ closeLeagueMenu(); return; }
  standingsIndex = index;
  loadStandings();
  if (activeTab === 'stats') loadStats();
  if (activeTab === 'news') loadNews();
  closeLeagueMenu();
}
leagueMenuBtn.addEventListener('click', function(e){
  e.stopPropagation();
  renderLeagueMenu();
  if (leagueMenuEl.classList.contains('is-open')) closeLeagueMenu();
  else openLeagueMenu();
});
leagueMenuEl.addEventListener('click', function(e){
  const item = e.target.closest('.league-menu-item');
  if (!item) return;
  switchToLeague(Number(item.getAttribute('data-index')));
});
document.addEventListener('click', function(e){
  if (!leagueMenuEl.classList.contains('is-open')) return;
  if (leagueMenuEl.contains(e.target) || leagueMenuBtn.contains(e.target)) return;
  closeLeagueMenu();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeLeagueMenu();
});
renderLeagueMenu();

// Quietly fetch every competition's logo up front (not just the one currently
// open) so the dropdown shows real crests right away instead of letter badges.
function preloadLeagueLogos(){
  STANDINGS_LEAGUES.forEach(function(l, i){
    if (i === standingsIndex || leagueLogos[l.id]) return; // active one loads via loadStandings()
    fetch('/api/standings?league=' + l.id)
      .then(function(res){ return res.json(); })
      .then(function(json){
        if (json && json.ok && json.data && json.data.league && json.data.league.logo){
          leagueLogos[l.id] = json.data.league.logo;
          renderLeagueMenu();
        }
      })
      .catch(function(){ /* leave the letter badge as a fallback */ });
  });
}

// ---- League news: full-width hero (league name, tagline, logo) + stories about the selected competition ----
function renderLeagueHero(){
  const meta = STANDINGS_LEAGUES[standingsIndex];
  const info = (window.FSTopics && window.FSTopics.LEAGUES[meta.id]) || {};
  const logo = leagueLogos[meta.id];
  document.getElementById('leagueHero').innerHTML =
    '<div class="lh-hero-in" data-fav-id="' + meta.id + '" data-fav-type="league" data-fav-name="' + escapeHtml(meta.name) + '" data-fav-badge="' + escapeHtml(logo || '') + '" data-fav-url="standings.html?league=' + meta.id + '"><div class="lh-text">' +
      '<div class="lh-eyebrow"><span class="dot"></span>Updated every week</div>' +
      '<h1 class="lh-title">' + escapeHtml(meta.name) + '</h1>' +
      '<p>' + escapeHtml(info.tagline || ('All the latest ' + meta.name + ' news in one place.')) + '</p>' +
    '</div><div class="lh-logo">' +
      (logo ? '<img src="' + escapeHtml(logo) + '" alt="' + escapeHtml(meta.name) + ' logo" />'
            : '<span class="lh-logo-fallback">' + escapeHtml(meta.abbr) + '</span>') +
    '</div></div>';
}
let newsLoadedFor = null;
function loadNews(){
  const meta = STANDINGS_LEAGUES[standingsIndex];
  renderLeagueHero();
  if (newsLoadedFor === meta.id) return;
  newsLoadedFor = meta.id;
  window.FSNewsFeed.mount(document.getElementById('leagueNewsFeed'), { league: meta.id }, { label: meta.name });
}

pageNav.addEventListener('click', function(e){
  const link = e.target.closest('a[data-tab]');
  if (!link) return;
  e.preventDefault();
  const tab = link.getAttribute('data-tab');
  if (tab === activeTab) return;
  activeTab = tab;
  Array.from(pageNav.querySelectorAll('a[data-tab]')).forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-tab') === tab);
  });
  Object.keys(tabPanels).forEach(function(key){
    tabPanels[key].classList.toggle('active', key === tab);
  });
  if (tab === 'stats') loadStats();
  if (tab === 'news') loadNews();
});

statsWrap.addEventListener('click', function(e){
  const btn = e.target.closest('.stats-sub-btn');
  if (!btn) return;
  const stat = btn.getAttribute('data-stat');
  if (stat === activeStatType) return;
  activeStatType = stat;
  Array.from(statsWrap.querySelectorAll('.stats-sub-btn')).forEach(function(b){
    b.classList.toggle('active', b === btn);
  });
  loadStats();
});

function zoneClass(key){
  if (!key) return '';
  if (key === 'ucl' || key === 'cl-r16') return 'zone-a';
  if (key === 'uel' || key === 'cl-playoff') return 'zone-b';
  if (key === 'rel' || key === 'cl-out') return 'zone-c';
  return '';
}
const ZONE_COLOR = { 'zone-a': 'var(--purple-bright)', 'zone-b': 'var(--orange-bright)', 'zone-c': '#E0567A' };

async function loadStandings(){
  const mySeq = ++seq;
  const meta = STANDINGS_LEAGUES[standingsIndex];
  history.replaceState(null, '', 'standings.html?league=' + meta.id);

  // favorites.js decorates any data-fav-* element with a persistent follow heart.
  leagueIdEl.setAttribute('data-fav-id', String(meta.id));
  leagueIdEl.setAttribute('data-fav-type', 'league');
  leagueIdEl.setAttribute('data-fav-name', meta.name);
  leagueIdEl.setAttribute('data-fav-url', 'standings.html?league=' + meta.id);
  leagueIdEl.setAttribute('data-fav-badge', leagueLogos[meta.id] || '');
  leagueIdEl.removeAttribute('data-fav-ready');
  leagueIdEl.innerHTML = '<span class="names"><span class="n1">' + escapeHtml(meta.name) + '</span>' +
    '<span class="n2">' + escapeHtml(meta.country) + '</span></span>';
  tableWrap.innerHTML = '<div class="state-msg">Loading table&hellip;</div>';

  try {
    const res = await fetch('/api/standings?league=' + meta.id);
    const json = await res.json();
    if (mySeq !== seq) return;
    if (!json.ok){
      tableWrap.innerHTML = '<div class="state-msg error">Table unavailable right now.</div>';
      return;
    }
    const d = json.data;
    if (d.league && d.league.logo) {
      leagueLogos[meta.id] = d.league.logo;
      leagueIdEl.setAttribute('data-fav-badge', d.league.logo);
      if (activeTab === 'news') renderLeagueHero();
      renderLeagueMenu();
    }
    if (d.league.logo){
      leagueIdEl.removeAttribute('data-fav-ready');
      leagueIdEl.innerHTML = '<img src="' + d.league.logo + '" alt="" />' + leagueIdEl.innerHTML;
    } else {
      leagueIdEl.removeAttribute('data-fav-ready');
      leagueIdEl.innerHTML = '<div class="league-badge-fallback">' + meta.abbr + '</div>' + leagueIdEl.innerHTML;
    }

    const hasForm = d.standings.some(function(r){ return r.form; });
    const legendSeen = {};

    const rows = d.standings.map(function(r){
      const zc = zoneClass(r.zoneKey);
      if (zc && r.zoneLabel) legendSeen[zc] = r.zoneLabel;
      const gdClass = r.goalsDiff > 0 ? 'pos' : (r.goalsDiff < 0 ? 'neg' : '');
      const gdText = r.goalsDiff > 0 ? '+' + r.goalsDiff : r.goalsDiff;
      let formHtml = '';
      if (hasForm){
        formHtml = '<td><div class="form">' +
          (r.form || []).slice(-5).map(function(res){
            return '<span class="form-badge ' + res + '">' + res + '</span>';
          }).join('') +
        '</div></td>';
      }
      return '<tr>' +
        '<td class="rank">' +
          (zc ? '<span style="position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:2px;background:' + ZONE_COLOR[zc] + ';"></span>' : '') +
          r.rank +
        '</td>' +
        '<td class="team-col">' + (function(){
          var h = clubHref(r.team);
          var inner = (r.team.logo ? '<img src="' + r.team.logo + '" alt="" />' : '') + '<span>' + escapeHtml(r.team.name) + '</span>';
          return h ? '<a class="club-link" href="' + h + '" title="' + escapeHtml(r.team.name) + ' club page">' + inner + '</a>' : inner;
        })() + '</td>' +
        '<td>' + (r.played != null ? r.played : '-') + '</td>' +
        '<td>' + (r.won != null ? r.won : '-') + '</td>' +
        '<td>' + (r.draw != null ? r.draw : '-') + '</td>' +
        '<td>' + (r.lost != null ? r.lost : '-') + '</td>' +
        '<td>' + (r.goalsFor != null ? r.goalsFor : '-') + '</td>' +
        '<td>' + (r.goalsAgainst != null ? r.goalsAgainst : '-') + '</td>' +
        '<td class="gd ' + gdClass + '">' + gdText + '</td>' +
        '<td class="pts">' + r.points + '</td>' +
        formHtml +
      '</tr>';
    }).join('');

    const legendHtml = Object.keys(legendSeen).length
      ? '<div class="standings-legend">' +
          Object.keys(legendSeen).map(function(zc){
            return '<div class="standings-legend-item"><span class="standings-legend-swatch" style="background:' + ZONE_COLOR[zc] + ';"></span>' + escapeHtml(legendSeen[zc]) + '</div>';
          }).join('') +
        '</div>'
      : '';

    tableWrap.innerHTML =
      '<div class="standings-full-wrap">' +
        '<div class="standings-full-scroll"><table class="standings-full"><thead><tr>' +
          '<th></th><th class="team-col">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>' +
          (hasForm ? '<th>Form</th>' : '') +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        legendHtml +
      '</div>';
  } catch (e) {
    if (mySeq !== seq) return;
    tableWrap.innerHTML = '<div class="state-msg error">Table unavailable right now.</div>';
  }
}

async function loadStats(){
  const mySeq = ++statsSeq;
  const meta = STANDINGS_LEAGUES[standingsIndex];
  const cacheKey = meta.id + ':' + activeStatType;
  statsListWrap.innerHTML = '<div class="state-msg">Loading player stats&hellip;</div>';

  try {
    const res = await fetch('/api/stats?league=' + meta.id + '&type=' + activeStatType);
    const json = await res.json();
    if (mySeq !== statsSeq) return;
    if (!json.ok || !json.data || !json.data.length){
      statsListWrap.innerHTML = '<div class="state-msg error">Player stats unavailable right now.</div>';
      statsLoadedFor = null;
      return;
    }
    statsLoadedFor = cacheKey;

    const valueKey = activeStatType === 'assists' ? 'assists' : 'goals';
    const valueLabel = activeStatType === 'assists' ? 'Assists' : 'Goals';

    const rows = json.data.map(function(p){
      const photo = p.photo ? '<img class="player-photo" src="' + p.photo + '" alt="" />'
                             : '<div class="player-photo"></div>';
      const teamLogo = p.team && p.team.logo ? '<img src="' + p.team.logo + '" alt="" />' : '';
      const teamName = p.team ? escapeHtml(p.team.name) : '';
      const apps = p.appearances != null ? p.appearances + ' apps' : '';
      return '<div class="stats-row">' +
        '<div class="rank">' + p.rank + '</div>' +
        photo +
        '<div class="player-info">' +
          '<div class="player-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="player-team">' + (function(){
            var h = clubHref(p.team);
            var inner = teamLogo + '<span>' + teamName + '</span>';
            return h ? '<a class="club-link" href="' + h + '">' + inner + '</a>' : inner;
          })() + '</div>' +
        '</div>' +
        '<div class="stat-value">' + (p[valueKey] != null ? p[valueKey] : 0) + '</div>' +
        '<div class="stat-sub">' + (apps ? apps : valueLabel) + '</div>' +
      '</div>';
    }).join('');

    statsListWrap.innerHTML =
      '<div class="stats-list-wrap">' + rows +
      (json.stale ? '<div class="stats-stale-note">Showing the last available data &mdash; refreshing shortly.</div>' : '') +
      '</div>';
  } catch (e) {
    if (mySeq !== statsSeq) return;
    statsListWrap.innerHTML = '<div class="state-msg error">Player stats unavailable right now.</div>';
    statsLoadedFor = null;
  }
}

prevBtn.addEventListener('click', function(){
  standingsIndex = (standingsIndex - 1 + STANDINGS_LEAGUES.length) % STANDINGS_LEAGUES.length;
  loadStandings();
  if (activeTab === 'stats') loadStats();
  if (activeTab === 'news') loadNews();
  renderLeagueMenu();
});
nextBtn.addEventListener('click', function(){
  standingsIndex = (standingsIndex + 1) % STANDINGS_LEAGUES.length;
  loadStandings();
  if (activeTab === 'stats') loadStats();
  if (activeTab === 'news') loadNews();
  renderLeagueMenu();
});

loadStandings();
preloadLeagueLogos();
if (activeTab === 'stats') loadStats();
if (activeTab === 'news') loadNews();

</script>

<script src="club-links.js" defer></script>
<script src="player-search.js"></script>
</body>
