<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Matches &mdash; Football Stories</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --black: #08070A;
  --panel: #121116;
  --panel-2: #17151C;
  --line: rgba(255,255,255,0.08);
  --white: #F4F3F6;
  --muted: #9A96A3;
  --purple: #8A3FFC;
  --purple-bright: #A868FF;
  --orange: #FF7A1A;
  --orange-bright: #FF9540;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background:var(--black); color:var(--white); font-family:'Inter', sans-serif; overflow-x:hidden; }
.display{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; letter-spacing:0.01em; line-height:0.92; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
.wrap{ max-width:900px; margin:0 auto; padding:0 24px; }
@media (max-width:640px){ .wrap{ padding:0 16px; }
}

/* ---- top bar ---- */
.match-topbar{
  padding:20px 0;
  border-bottom:1px solid var(--line);
  background:rgba(8,7,10,0.85);
  backdrop-filter:blur(14px);
  position:sticky; top:0; z-index:50;
}
.match-topbar .wrap{ display:flex; align-items:center; justify-content:space-between; gap:14px; max-width:900px; }
.match-topbar .logo{ display:flex; align-items:center; gap:10px; font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:15px; text-transform:uppercase; }
.match-topbar .logo img{ width:26px; height:26px; object-fit:contain; }
.back-link{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); }
.back-link:hover{ color:#fff; }


/* ---- matches page layout ---- */
.matches-wrap{ max-width:1180px; margin:0 auto; padding:34px 24px 80px; }
@media (max-width:640px){ .matches-wrap{ padding:24px 16px 64px; } }

.matches-page-head{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:14px; margin-bottom:22px;
}
.matches-page-head h1{ font-size:26px; text-transform:uppercase; }

/* reuse of the homepage's Yesterday / Today / Tomorrow control, unchanged */
.scores-date-nav{ display:flex; align-items:center; gap:8px; }
.date-arrow{
  flex-shrink:0; width:30px; height:30px; border-radius:50%;
  background:var(--panel-2); border:1px solid var(--line); color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:border-color .2s ease, background .2s ease, opacity .2s ease;
}
.date-arrow:hover{ border-color:var(--purple-bright); background:var(--panel); }
.date-arrow:disabled{ opacity:.35; cursor:default; }
.date-arrow:disabled:hover{ border-color:var(--line); background:var(--panel-2); }
.date-strip{ display:flex; gap:8px; }
.date-btn{
  flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted);
  font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
  white-space:nowrap; transition:border-color .2s ease, color .2s ease, background .2s ease;
}
.date-btn:hover{ color:#fff; }
.date-btn.active{ background:linear-gradient(100deg, var(--purple), #6C1FE0); color:#fff; border-color:transparent; }

.matches-layout{ display:grid; grid-template-columns: 1fr 340px; gap:22px; align-items:start; }
@media (max-width:900px){ .matches-layout{ grid-template-columns:1fr; } }

/* ---- grouped match list ---- */
.league-group{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  overflow:hidden; margin-bottom:16px;
}
.league-group-head{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  background:var(--panel-2); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em;
  transition:background .2s ease, color .2s ease;
}
a.league-group-head:hover{ background:#201d29; color:var(--purple-bright); }
.league-group-head img{ width:20px; height:20px; object-fit:contain; }
.match-row{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  border-top:1px solid var(--line); font-size:13.5px;
}
.match-row:hover{ background:var(--panel-2); }
.match-row .status-pill{
  flex-shrink:0; width:46px; text-align:center; font-size:11px; font-weight:700;
  color:var(--muted); text-transform:uppercase;
}
.match-row .status-pill.live{ color:var(--orange-bright); }
.match-row .team{ flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
.match-row .team.away{ justify-content:flex-end; text-align:right; }
.match-row .team img{ width:20px; height:20px; object-fit:contain; flex-shrink:0; }
.match-row .team .n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.match-row .score{
  flex-shrink:0; min-width:52px; text-align:center; font-weight:800;
  font-family:'Big Shoulders Display', sans-serif; font-size:16px;
}
.matches-state{ text-align:center; padding:44px 12px; color:var(--muted); font-size:14px; }
.matches-state.error{ color:var(--orange-bright); }

/* ---- standings panel ---- */
.standings-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:16px; position:sticky; top:96px;
}
.standings-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
.standings-head .league-id{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  min-width:0; flex:1; text-align:center;
}
.standings-head .league-id img{ width:34px; height:34px; object-fit:contain; flex-shrink:0; }
.league-badge-fallback-sm{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg, var(--purple), var(--orange));
  display:flex; align-items:center; justify-content:center;
  font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:10.5px;
}
.standings-head .league-id .names{ display:flex; flex-direction:column; align-items:center; min-width:0; }
.standings-head .league-id .n1{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
.standings-head .league-id .n2{ font-size:11px; color:var(--muted); margin-top:1px; }
.standings-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.standings-table th{
  text-align:left; font-size:10.5px; color:var(--muted); text-transform:uppercase;
  padding:6px 4px; font-weight:600; border-bottom:1px solid var(--line);
}
.standings-table th.num, .standings-table td.num{ text-align:center; }
.standings-table td{ padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
.standings-table tr:last-child td{ border-bottom:none; }
.standings-table .rank{
  width:22px; text-align:center; font-weight:700; color:var(--muted); position:relative;
}
.standings-table .rank::before{
  content:''; position:absolute; left:-4px; top:2px; bottom:2px; width:3px; border-radius:2px;
}
.standings-table tr.zone-continental .rank::before{ background:var(--purple-bright); }
.standings-table tr.zone-europa .rank::before{ background:var(--orange-bright); }
.standings-table tr.zone-relegation .rank::before{ background:#E0567A; }
.see-details-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  margin-top:14px; padding:11px 14px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
  font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em;
  color:var(--muted); transition:border-color .2s ease, color .2s ease;
}
.see-details-btn:hover{ border-color:var(--purple-bright); color:#fff; }
.see-details-btn svg{ flex-shrink:0; }
.standings-table .club{ display:flex; align-items:center; gap:7px; min-width:0; }
.standings-table .club img{ width:17px; height:17px; object-fit:contain; flex-shrink:0; }
.standings-table .club .n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.standings-table .pts{ font-weight:800; color:#fff; }

</style>
</head>

<script>
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function pad(n){ return String(n).padStart(2, '0'); }

// ---- date-nav: identical local-calendar-day logic to the homepage's
// Yesterday/Today/Tomorrow strip, kept in sync deliberately so a date
// picked here means the same real-world day it would on the homepage.
const datePrevBtn = document.getElementById('datePrev');
const dateNextBtn = document.getElementById('dateNext');
const dateBtns = document.querySelectorAll('.date-btn');
let selectedOffset = 0;

function dateForOffset(offsetDays){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return d;
}
function toDateStr(d){
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function updateDateControls(){
  dateBtns.forEach(function(btn){
    btn.classList.toggle('active', Number(btn.getAttribute('data-offset')) === selectedOffset);
  });
  datePrevBtn.disabled = selectedOffset <= -1;
  dateNextBtn.disabled = selectedOffset >= 1;
}

// ---- grouped match list --------------------------------------------------
// League display order for the grouped list (independent of the standings
// cycle order below, which the person specified separately).
const GROUP_ORDER = [39, 140, 135, 78, 61, 2, 3, 71, 94, 5, 29];
const matchesList = document.getElementById('matchesList');
let listSeq = 0;

function statusLabel(f){
  if (f.isLive) return f.minute ? f.minute + "'" : 'LIVE';
  if (f.statusShort === 'HT') return 'HT';
  if (['FT','AET','PEN'].indexOf(f.statusShort) !== -1) return 'FT';
  if (f.statusShort === 'NS'){
    const d = new Date(f.date);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  return f.statusShort || '';
}

function renderMatchesList(fixtures, leagues){
  if (!fixtures.length){
    matchesList.innerHTML = '<div class="matches-state">No matches available for this date.</div>';
    return;
  }
  const byLeague = {};
  fixtures.forEach(function(f){
    (byLeague[f.league.id] = byLeague[f.league.id] || []).push(f);
  });
  const orderedIds = GROUP_ORDER.filter(function(id){ return byLeague[id]; })
    .concat(Object.keys(byLeague).map(Number).filter(function(id){ return GROUP_ORDER.indexOf(id) === -1; }));

  let html = '';
  orderedIds.forEach(function(id){
    const group = byLeague[id].slice().sort(function(a, b){ return new Date(a.date) - new Date(b.date); });
    const logo = group[0].league.logo;
    html += '<div class="league-group">' +
      '<a class="league-group-head" href="standings.html?league=' + id + '">' + (logo ? '<img src="' + logo + '" alt="" />' : '') +
        escapeHtml(leagues[id] || group[0].league.name) + '</a>';
    group.forEach(function(f){
      html += '<a class="match-row" href="match.html?id=' + f.id + '">' +
        '<span class="status-pill' + (f.isLive ? ' live' : '') + '">' + escapeHtml(statusLabel(f)) + '</span>' +
        '<span class="team home">' + (f.home.logo ? '<img src="' + f.home.logo + '" alt="" />' : '') +
          '<span class="n">' + escapeHtml(f.home.name) + '</span></span>' +
        '<span class="score">' + (f.goals.home === null || f.goals.home === undefined ? '-' : f.goals.home) +
          ' &ndash; ' + (f.goals.away === null || f.goals.away === undefined ? '-' : f.goals.away) + '</span>' +
        '<span class="team away">' +
          '<span class="n">' + escapeHtml(f.away.name) + '</span>' +
          (f.away.logo ? '<img src="' + f.away.logo + '" alt="" />' : '') + '</span>' +
      '</a>';
    });
    html += '</div>';
  });
  matchesList.innerHTML = html;
}

async function loadMatchesList(){
  const seq = ++listSeq;
  matchesList.innerHTML = '<div class="matches-state">Loading matches&hellip;</div>';
  const dateStr = toDateStr(dateForOffset(selectedOffset));
  try {
    const res = await fetch('/api/scores?view=date&date=' + encodeURIComponent(dateStr) + '&league=all');
    const json = await res.json();
    if (seq !== listSeq) return;
    if (!json.ok){
      matchesList.innerHTML = '<div class="matches-state error">Unable to load matches right now.<br>Please try again later.</div>';
      return;
    }
    renderMatchesList(json.fixtures || [], json.leagues || {});
  } catch (e) {
    if (seq !== listSeq) return;
    matchesList.innerHTML = '<div class="matches-state error">Unable to load matches right now.<br>Please try again later.</div>';
  }
}

datePrevBtn.addEventListener('click', function(){
  if (selectedOffset <= -1) return;
  selectedOffset -= 1;
  updateDateControls();
  loadMatchesList();
});
dateNextBtn.addEventListener('click', function(){
  if (selectedOffset >= 1) return;
  selectedOffset += 1;
  updateDateControls();
  loadMatchesList();
});
dateBtns.forEach(function(btn){
  btn.addEventListener('click', function(){
    selectedOffset = Number(btn.getAttribute('data-offset'));
    updateDateControls();
    loadMatchesList();
  });
});

// ---- standings panel ------------------------------------------------------
// Cycle order exactly as requested: Premier League, Serie A, Bundesliga,
// La Liga, Ligue 1, Champions League.
const STANDINGS_LEAGUES = [
  { id: 39, name: 'Premier League', country: 'England', abbr: 'PL' },
  { id: 135, name: 'Serie A', country: 'Italy', abbr: 'SA' },
  { id: 78, name: 'Bundesliga', country: 'Germany', abbr: 'BL' },
  { id: 140, name: 'La Liga', country: 'Spain', abbr: 'LL' },
  { id: 61, name: 'Ligue 1', country: 'France', abbr: 'L1' },
  { id: 2, name: 'Champions League', country: 'Europe', abbr: 'UCL' },
  { id: 71, name: 'Brasileirão Série A', country: 'Brazil', abbr: 'BSA' },
  { id: 94, name: 'Primeira Liga', country: 'Portugal', abbr: 'PPL' },
];
let standingsIndex = 0;
let standingsSeq = 0;
const standingsPrevBtn = document.getElementById('standingsPrev');
const standingsNextBtn = document.getElementById('standingsNext');
const standingsLeagueId = document.getElementById('standingsLeagueId');
const standingsBody = document.getElementById('standingsBody');
const seeStandingsDetails = document.getElementById('seeStandingsDetails');

function zoneClass(description){
  if (!description) return '';
  const d = description.toLowerCase();
  if (d.indexOf('champions league') !== -1 || d.indexOf('qualification') !== -1) return 'zone-continental';
  if (d.indexOf('europa') !== -1 || d.indexOf('conference') !== -1) return 'zone-europa';
  if (d.indexOf('relegation') !== -1) return 'zone-relegation';
  return '';
}

async function loadStandings(){
  const seq = ++standingsSeq;
  const meta = STANDINGS_LEAGUES[standingsIndex];
  seeStandingsDetails.href = 'standings.html?league=' + meta.id;
  standingsLeagueId.innerHTML = '<span class="names"><span class="n1">' + escapeHtml(meta.name) + '</span>' +
    '<span class="n2">' + escapeHtml(meta.country) + '</span></span>';
  standingsBody.innerHTML = '<div class="matches-state">Loading table&hellip;</div>';
  try {
    const res = await fetch('/api/standings?league=' + meta.id);
    const json = await res.json();
    if (seq !== standingsSeq) return;
    if (!json.ok){
      standingsBody.innerHTML = '<div class="matches-state error">Table unavailable right now.</div>';
      return;
    }
    const d = json.data;
    if (d.league.logo){
      standingsLeagueId.innerHTML = '<img src="' + d.league.logo + '" alt="" />' + standingsLeagueId.innerHTML;
    } else {
      standingsLeagueId.innerHTML = '<div class="league-badge-fallback-sm">' + meta.abbr + '</div>' + standingsLeagueId.innerHTML;
    }
    const rows = d.standings.map(function(r){
      return '<tr class="' + zoneClass(r.description) + '">' +
        '<td class="rank">' + r.rank + '</td>' +
        '<td class="club">' + (r.team.logo ? '<img src="' + r.team.logo + '" alt="" />' : '') +
          '<span class="n">' + escapeHtml(r.team.name) + '</span></td>' +
        '<td class="num">' + (r.played != null ? r.played : '-') + '</td>' +
        '<td class="num">' + (r.goalsDiff > 0 ? '+' + r.goalsDiff : r.goalsDiff) + '</td>' +
        '<td class="num pts">' + r.points + '</td>' +
      '</tr>';
    }).join('');
    standingsBody.innerHTML =
      '<table class="standings-table"><thead><tr>' +
        '<th></th><th>Club</th><th class="num">PL</th><th class="num">GD</th><th class="num">PTS</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  } catch (e) {
    if (seq !== standingsSeq) return;
    standingsBody.innerHTML = '<div class="matches-state error">Table unavailable right now.</div>';
  }
}

standingsPrevBtn.addEventListener('click', function(){
  standingsIndex = (standingsIndex - 1 + STANDINGS_LEAGUES.length) % STANDINGS_LEAGUES.length;
  loadStandings();
});
standingsNextBtn.addEventListener('click', function(){
  standingsIndex = (standingsIndex + 1) % STANDINGS_LEAGUES.length;
  loadStandings();
});

updateDateControls();
loadMatchesList();
loadStandings();
</script>
